<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Airbnb DE Drills — SQL + Python Interview Trainer</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>

<style>
  :root {
    --bg: #0b0f14;
    --panel: #121820;
    --panel-2: #0f141b;
    --edge: #1e2833;
    --edge-2: #263341;
    --ink: #e6edf3;
    --muted: #8b98a6;
    --faint: #5c6875;
    --amber: #f2b45a;
    --amber-dim: #7a5c2c;
    --pass: #4ec9a8;
    --fail: #e5646e;
    --cyan: #56b6c2;
    --violet: #b18cf0;
    --mono: "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(900px 500px at 88% -8%, rgba(242,180,90,0.06), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 18px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--edge);
    background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
    position: sticky; top: 0; z-index: 20;
    backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; font-family: var(--mono); }
  .brand .cursor { color: var(--amber); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .brand .cursor { animation: none; } }
  .brand .name { font-weight: 600; letter-spacing: -0.2px; font-size: 15px; }
  .brand .sub { color: var(--faint); font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; }

  .tracks { display: flex; gap: 4px; margin-left: 12px; }
  .tracks button {
    font-family: var(--mono); font-size: 12px; letter-spacing: .4px;
    background: transparent; color: var(--muted);
    border: 1px solid var(--edge); border-radius: 6px;
    padding: 5px 12px; cursor: pointer;
  }
  .tracks button:hover { border-color: var(--edge-2); color: var(--ink); }
  .tracks button.on { color: var(--amber); border-color: var(--amber-dim); background: rgba(242,180,90,0.08); }

  .progress-wrap { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .progress-text { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .progress-text b { color: var(--amber); }
  .bar { width: 180px; height: 6px; border-radius: 999px; background: var(--edge); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber)); transition: width .35s ease; }

  /* ---------- Layout ---------- */
  .shell { display: grid; grid-template-columns: 288px 1fr; height: calc(100vh - 57px); }

  .sidebar {
    border-right: 1px solid var(--edge);
    background: var(--panel-2);
    display: flex; flex-direction: column; min-height: 0;
  }
  .filter-panel { padding: 14px; border-bottom: 1px solid var(--edge); }
  .filter-search {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 6px;
    padding: 7px 9px; font-size: 13px; font-family: var(--sans);
  }
  .filter-search:focus { outline: none; border-color: var(--amber-dim); }
  .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .filter-field label {
    display: block; font-size: 10px; text-transform: uppercase;
    letter-spacing: .6px; color: var(--faint); margin-bottom: 3px;
  }
  .filter-field select {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 6px;
    padding: 5px 6px; font-size: 12px; font-family: var(--sans);
  }
  .filter-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; font-size: 11px; color: var(--faint); font-family: var(--mono);
  }
  .filter-meta .clear {
    background: none; border: none; color: var(--amber);
    font-size: 11px; cursor: pointer; font-family: var(--mono); padding: 0;
  }
  .filter-meta .clear:disabled { color: var(--faint); cursor: default; }

  .side-list { overflow-y: auto; flex: 1; padding: 6px 0 30px; min-height: 0; }
  .side-item {
    display: flex; align-items: flex-start; gap: 9px;
    padding: 8px 14px; cursor: pointer; border-left: 2px solid transparent;
  }
  .side-item:hover { background: rgba(255,255,255,0.02); }
  .side-item.active { background: rgba(242,180,90,0.07); border-left-color: var(--amber); }
  .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--edge-2); }
  .dot.solved { background: var(--pass); }
  .dot.failed { background: var(--fail); }
  .dot.inprogress { background: var(--amber); }
  .side-item .txt { min-width: 0; }
  .side-item .t { font-size: 12.5px; line-height: 1.35; }
  .side-item .m { font-size: 10.5px; color: var(--faint); font-family: var(--mono); margin-top: 2px; }
  .side-item .m .og { color: var(--cyan); }
  .side-item .m .og.p { color: var(--faint); }

  .main { overflow-y: auto; padding: 22px 30px 80px; min-width: 0; }
  .crumbs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .4px;
    border: 1px solid var(--edge-2); border-radius: 999px;
    padding: 2px 9px; color: var(--muted);
  }
  .pill.orig { color: var(--cyan); border-color: rgba(86,182,194,.45); background: rgba(86,182,194,.08); }
  .pill.prac { color: var(--faint); }
  .pill.hard { color: var(--fail); border-color: rgba(229,100,110,.4); }
  .pill.medium { color: var(--amber); border-color: var(--amber-dim); }

  .title { font-size: 21px; margin: 4px 0 6px; letter-spacing: -0.3px; }
  .srcline {
    font-size: 11.5px; color: var(--faint); font-family: var(--mono);
    border-left: 2px solid var(--edge-2); padding-left: 9px; margin-bottom: 14px;
  }
  .prompt {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
    padding: 14px 16px; font-size: 14px; white-space: pre-wrap; margin-bottom: 16px;
  }
  .prompt code {
    font-family: var(--mono); font-size: 12.5px;
    background: var(--bg); border: 1px solid var(--edge); border-radius: 4px; padding: 1px 5px;
  }
  .prompt b { color: var(--amber); font-weight: 600; }

  .editor-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--faint); margin: 0 0 6px; font-family: var(--mono);
  }
  .editor-shell { border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .CodeMirror { height: 320px; background: var(--panel); color: var(--ink); font-family: var(--mono); font-size: 13px; }
  .CodeMirror-gutters { background: var(--panel-2); border-right: 1px solid var(--edge); }
  .CodeMirror-linenumber { color: var(--faint); }
  .CodeMirror-cursor { border-left: 1.5px solid var(--amber); }
  .CodeMirror-selected { background: rgba(242,180,90,0.14) !important; }
  .cm-s-default .cm-keyword { color: var(--violet); }
  .cm-s-default .cm-string, .cm-s-default .cm-string-2 { color: var(--pass); }
  .cm-s-default .cm-number { color: var(--amber); }
  .cm-s-default .cm-comment { color: var(--faint); font-style: italic; }
  .cm-s-default .cm-builtin, .cm-s-default .cm-def { color: var(--cyan); }
  .cm-s-default .cm-variable-2, .cm-s-default .cm-atom { color: var(--cyan); }
  textarea#code {
    width: 100%; height: 320px; background: var(--panel); color: var(--ink);
    border: none; padding: 10px; font-family: var(--mono); font-size: 13px; resize: vertical;
  }
  textarea#code:focus { outline: none; }

  .controls { display: flex; align-items: center; gap: 9px; margin: 14px 0 4px; flex-wrap: wrap; }
  button.run {
    background: linear-gradient(180deg, var(--amber), #dd9c42);
    color: #241703; border: none; border-radius: 6px;
    padding: 8px 16px; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  button.run:disabled { opacity: .5; cursor: default; }
  button.ghost, .nav-spacer button {
    background: transparent; color: var(--muted);
    border: 1px solid var(--edge-2); border-radius: 6px;
    padding: 7px 13px; font-size: 13px; cursor: pointer;
  }
  button.ghost:hover, .nav-spacer button:hover { color: var(--ink); border-color: var(--amber-dim); }
  .nav-spacer { margin-left: auto; display: flex; gap: 8px; }
  .status-line { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .results { margin-top: 16px; }
  .case {
    border: 1px solid var(--edge); border-radius: 8px;
    padding: 10px 13px; margin-bottom: 8px; background: var(--panel);
    font-family: var(--mono); font-size: 12.5px;
  }
  .case.pass { border-color: rgba(78,201,168,.4); }
  .case.fail { border-color: rgba(229,100,110,.45); }
  .case .hd { display: flex; gap: 9px; align-items: center; }
  .case .verdict.pass { color: var(--pass); }
  .case .verdict.fail { color: var(--fail); }
  .case .kv { color: var(--faint); margin-top: 5px; word-break: break-word; }
  .case .kv b { color: var(--muted); font-weight: 500; }
  .summary {
    font-family: var(--mono); font-size: 13px; padding: 9px 13px;
    border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--edge);
  }
  .summary.ok { color: var(--pass); border-color: rgba(78,201,168,.4); background: rgba(78,201,168,.06); }
  .summary.no { color: var(--fail); border-color: rgba(229,100,110,.4); background: rgba(229,100,110,.06); }

  table.grid { border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; width: 100%; }
  table.grid th, table.grid td {
    border: 1px solid var(--edge); padding: 3px 7px; text-align: left; white-space: nowrap;
  }
  table.grid th { color: var(--amber); background: var(--panel-2); font-weight: 500; }
  table.grid td { color: var(--muted); }
  .gridwrap { overflow-x: auto; margin-top: 6px; }
  .gridnote { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 5px; }

  details.schema { margin-bottom: 16px; }
  details.schema summary {
    cursor: pointer; font-family: var(--mono); font-size: 12px;
    color: var(--muted); padding: 7px 11px;
    border: 1px solid var(--edge); border-radius: 8px; background: var(--panel-2);
  }
  details.schema[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .schema-body {
    border: 1px solid var(--edge); border-top: none;
    border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
    padding: 11px 13px; background: var(--panel); font-family: var(--mono); font-size: 11.5px;
    max-height: 260px; overflow-y: auto;
  }
  .schema-body .tb { color: var(--amber); }
  .schema-body .cl { color: var(--faint); }
  .schema-body div { margin-bottom: 4px; }

  .answer {
    margin-top: 14px; border: 1px solid var(--edge-2); border-radius: 8px;
    background: var(--panel); padding: 13px 15px;
  }
  .answer h4 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .7px; color: var(--faint); font-family: var(--mono);
  }
  .answer pre {
    margin: 0; font-family: var(--mono); font-size: 12.5px;
    white-space: pre-wrap; color: var(--ink); background: var(--bg);
    padding: 11px; border-radius: 6px; border: 1px solid var(--edge);
  }
  .answer .acts { margin-top: 9px; display: flex; gap: 8px; }

  #boot {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  #boot.on { display: flex; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--edge-2); border-top-color: var(--amber);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .b-title { font-family: var(--mono); font-size: 14px; }
  .b-sub { font-family: var(--mono); font-size: 12px; color: var(--faint); }
</style>
</head>
<body>

<div id="boot">
  <div class="spinner" aria-hidden="true"></div>
  <div class="b-title">starting runtime<span style="color:var(--amber)">_</span></div>
  <div class="b-sub" id="boot-sub">loading…</div>
</div>

<div class="topbar">
  <div class="brand">
    <span class="name">airbnb&nbsp;drills<span class="cursor">_</span></span>
    <span class="sub">senior de trainer</span>
  </div>
  <div class="tracks">
    <button id="tab-sql" class="on">SQL</button>
    <button id="tab-python">PYTHON</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-text"><b id="solved-count">0</b> / <span id="total-count">0</span> solved</div>
    <div class="bar"><i id="bar-fill"></i></div>
  </div>
</div>

<div class="shell">
  <aside class="sidebar">
    <div class="filter-panel">
      <input type="text" class="filter-search" id="f-search" placeholder="Search problems…" />
      <div class="filter-grid">
        <div class="filter-field">
          <label for="f-origin">Tag</label>
          <select id="f-origin">
            <option value="">All</option>
            <option value="ORIGINAL">Original (asked)</option>
            <option value="PRACTICE">Practice</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="f-category">Category</label>
          <select id="f-category"><option value="">All</option></select>
        </div>
        <div class="filter-field">
          <label for="f-difficulty">Difficulty</label>
          <select id="f-difficulty">
            <option value="">All</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="">All</option>
            <option value="notstarted">Not Started</option>
            <option value="inprogress">In Progress</option>
            <option value="failed">Failed</option>
            <option value="solved">Solved</option>
          </select>
        </div>
      </div>
      <div class="filter-meta">
        <span id="f-count">0 shown</span>
        <button class="clear" id="f-clear" disabled>Clear filters</button>
      </div>
    </div>
    <div class="side-list" id="side-list"></div>
  </aside>

  <main class="main">
    <div class="crumbs">
      <span class="pill" id="origin-pill">—</span>
      <span class="pill" id="topic-pill">—</span>
      <span class="pill" id="diff-pill">—</span>
      <span class="pill" id="idx-pill">—</span>
    </div>
    <h1 class="title" id="title">—</h1>
    <div class="srcline" id="srcline">—</div>

    <details class="schema" id="schema-box">
      <summary>Schema — 18 tables you can query</summary>
      <div class="schema-body" id="schema-body"></div>
    </details>

    <div class="prompt" id="prompt">—</div>

    <p class="editor-label" id="editor-label">Your solution</p>
    <div class="editor-shell" id="editor-shell"><textarea id="code" spellcheck="false"></textarea></div>

    <div class="controls">
      <button class="run" id="btn-run">▶ Run</button>
      <button class="ghost" id="btn-answer">Show Answer</button>
      <button class="ghost" id="btn-reset">Reset</button>
      <span class="status-line" id="status"></span>
      <div class="nav-spacer">
        <button id="btn-prev">← Previous</button>
        <button id="btn-next">Next →</button>
      </div>
    </div>

    <div class="results" id="results"></div>
    <div id="answer-mount"></div>
  </main>
</div>

h","2025-03-14 04:03:33","2025-03-15 11:18:34",null],[267,232,"rebook_nudge","2025-06-05 16:27:44","2025-06-07 01:24:25",null],[268,235,"rebook_nudge","2025-11-19 11:33:09",null,null],[269,84,"rebook_nudge","2025-12-11 08:15:16","2025-12-12 22:04:44","2025-12-13 23:01:16"],[270,50,"rebook_nudge","2025-04-02 22:04:51",null,null],[271,164,"winter_promo","2025-01-11 10:12:13","2025-01-13 02:02:18","2025-01-11 03:20:53"],[272,246,"rebook_nudge","2025-08-25 21:45:43","2025-08-26 03:06:55",null],[273,228,"host_welcome","2025-10-03 12:06:27",null,null],[274,226,"host_welcome","2025-11-10 18:01:10","2025-11-12 04:39:08",null],[275,121,"rebook_nudge","2025-06-30 17:10:00",null,null],[276,136,"rebook_nudge","2025-11-02 06:39:36",null,null],[277,178,"host_welcome","2025-08-03 13:47:48",null,null],[278,185,"abandoned_search","2025-04-23 06:59:48",null,null],[279,81,"host_welcome","2025-07-03 08:29:38",null,null],[280,110,"winter_promo","2025-03-04 08:34:21",null,null],[281,249,"host_welcome","2025-05-24 20:28:58",null,null],[282,128,"winter_promo","2025-11-14 20:44:14","2025-11-16 09:54:01",null],[283,131,"host_welcome","2025-01-16 12:24:57","2025-01-17 07:11:04",null],[284,29,"host_welcome","2025-04-09 05:39:08",null,null],[285,75,"abandoned_search","2025-10-28 17:47:11","2025-10-30 06:29:30",null],[286,107,"rebook_nudge","2025-11-13 06:19:12","2025-11-15 21:23:25",null],[287,238,"winter_promo","2025-10-13 11:18:49",null,null],[288,217,"host_welcome","2025-01-26 14:17:22","2025-01-26 21:14:11",null],[289,104,"abandoned_search","2025-03-10 15:53:36",null,null],[290,26,"host_welcome","2025-02-22 23:22:38",null,null],[291,63,"host_welcome","2025-02-05 00:12:10",null,null],[292,48,"rebook_nudge","2025-11-07 17:13:06",null,null],[293,160,"abandoned_search","2025-04-11 05:35:49",null,null],[294,201,"abandoned_search","2025-09-22 22:45:27",null,null],[295,212,"host_welcome","2025-06-22 14:20:00","2025-06-24 04:20:36",null],[296,127,"abandoned_search","2025-11-03 10:53:02",null,null],[297,209,"winter_promo","2025-11-02 10:44:19",null,null],[298,72,"abandoned_search","2025-11-16 19:18:07","2025-11-18 21:33:39",null],[299,13,"abandoned_search","2025-06-22 06:30:57","2025-06-24 14:04:28",null],[300,212,"winter_promo","2025-10-09 21:49:24","2025-10-09 17:56:50","2025-10-10 23:01:13"]]}},"sql":[{"id":"S01","title":"Host fill rate in first 90 days, ranked within market","origin":"ORIGINAL","source":"DataVidhya - Airbnb DE interview guide, sample question at round difficulty (May 2026) - stated verbatim as the SQL-round difficulty bar. Denominator wording adapted to this dataset.","category":"Marketplace Metrics","difficulty":"Hard","tags":["Night Grain","Recursive CTE","Window","Fill Rate"],"prompt":"A host's first 90 days is the 90-day window starting on the check-in date of their earliest confirmed or completed booking (day 0 inclusive, day 89 inclusive).\n\nExpand bookings to <b>night grain<\/b> (a booking with check_in 2025-06-01 and check_out 2025-06-04 occupies 3 nights: Jun 1, 2, 3). Count only nights from bookings with status 'confirmed' or 'completed'.\n\nFor every host, return booked nights that fall inside their first-90-day window, a fill rate of booked_nights / 90, and the host's rank within their market (rank 1 = highest fill rate; break ties by host_id ascending).\n\nColumns: host_id, market, booked_nights, fill_rate (ROUND 4), rank_in_market","starter":"-- night-grain expansion, then the 90-day window, then rank\nWITH RECURSIVE nights AS (\n  \n)\nSELECT ...","solution":"WITH RECURSIVE nights AS (\n  SELECT booking_id, host_id, check_in AS dt, check_out\n  FROM bookings\n  WHERE status IN ('confirmed','completed')\n  UNION ALL\n  SELECT booking_id, host_id, date(dt, '+1 day'), check_out\n  FROM nights\n  WHERE date(dt, '+1 day') < check_out\n),\nfirst_stay AS (\n  SELECT host_id, MIN(check_in) AS d0\n  FROM bookings\n  WHERE status IN ('confirmed','completed')\n  GROUP BY host_id\n),\nbooked AS (\n  SELECT n.host_id, COUNT(*) AS booked_nights\n  FROM nights n\n  JOIN first_stay f ON f.host_id = n.host_id\n  WHERE n.dt >= f.d0 AND n.dt < date(f.d0, '+90 day')\n  GROUP BY n.host_id\n)\nSELECT h.host_id,\n       h.market,\n       b.booked_nights,\n       ROUND(1.0 * b.booked_nights / 90, 4) AS fill_rate,\n       ROW_NUMBER() OVER (PARTITION BY h.market\n                          ORDER BY 1.0 * b.booked_nights / 90 DESC, h.host_id) AS rank_in_market\nFROM booked b\nJOIN hosts h ON h.host_id = b.host_id"},{"id":"S02","title":"Guests who booked for the first time, by month","origin":"ORIGINAL","source":"LeetCode Discuss - Airbnb Senior Data Engineer (Bangalore) full loop write-up - online assessment, 'people who booked the first time'.","category":"Cohorts","difficulty":"Medium","tags":["First Event","Grouping"],"prompt":"Using every booking regardless of status, find each guest's first-ever booking (earliest booked_at).\n\nReturn, for each month, how many guests placed their first-ever booking in that month.\n\nColumns: booking_month (YYYY-MM), first_time_guests","starter":"SELECT ...","solution":"WITH firsts AS (\n  SELECT guest_id, MIN(booked_at) AS first_booked_at\n  FROM bookings\n  GROUP BY guest_id\n)\nSELECT strftime('%Y-%m', first_booked_at) AS booking_month,\n       COUNT(*) AS first_time_guests\nFROM firsts\nGROUP BY 1"},{"id":"S03","title":"Rolling 3-month average of cancellations","origin":"ORIGINAL","source":"LeetCode Discuss - Airbnb Senior Data Engineer (Bangalore) full loop write-up - online assessment, 'rolling 3 months cancellations average'.","category":"Windows","difficulty":"Medium","tags":["Rolling Window","Frames"],"prompt":"A booking counts as cancelled in the month of its cancelled_at timestamp.\n\nFor each month that has at least one cancellation, return the cancellation count and the rolling average over that month and the two months before it (fewer months at the start of the series is fine - average what exists).\n\nColumns: cancel_month (YYYY-MM), cancellations, rolling_3mo_avg (ROUND 2)","starter":"SELECT ...","solution":"WITH m AS (\n  SELECT strftime('%Y-%m', cancelled_at) AS cancel_month, COUNT(*) AS cancellations\n  FROM bookings\n  WHERE cancelled_at IS NOT NULL\n  GROUP BY 1\n)\nSELECT cancel_month,\n       cancellations,\n       ROUND(AVG(cancellations) OVER (ORDER BY cancel_month\n             ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 2) AS rolling_3mo_avg\nFROM m"},{"id":"S04","title":"Busiest season","origin":"ORIGINAL","source":"LeetCode Discuss - Airbnb Senior Data Engineer (Bangalore) full loop write-up - online assessment, 'busiest season'.","category":"Marketplace Metrics","difficulty":"Medium","tags":["CASE","Date Buckets"],"prompt":"Bucket each booking by the season of its check_in date: Dec-Feb = 'winter', Mar-May = 'spring', Jun-Aug = 'summer', Sep-Nov = 'autumn'.\n\nCount only bookings that were not cancelled. Return one row per season with the number of bookings and total nights sold.\n\nColumns: season, bookings, nights_sold","starter":"SELECT ...","solution":"SELECT CASE\n         WHEN CAST(strftime('%m', check_in) AS INTEGER) IN (12,1,2) THEN 'winter'\n         WHEN CAST(strftime('%m', check_in) AS INTEGER) IN (3,4,5)  THEN 'spring'\n         WHEN CAST(strftime('%m', check_in) AS INTEGER) IN (6,7,8)  THEN 'summer'\n         ELSE 'autumn'\n       END AS season,\n       COUNT(*) AS bookings,\n       SUM(nights) AS nights_sold\nFROM bookings\nWHERE status <> 'cancelled'\nGROUP BY 1"},{"id":"S05","title":"Three metrics off the transaction table","origin":"ORIGINAL","source":"LeetCode Discuss - Airbnb Senior Data Engineer (Bangalore) full loop write-up - onsite SQL round: 'a transaction table, asked to develop three metrics', then asked to parameterise it.","category":"Marketplace Metrics","difficulty":"Medium","tags":["Aggregation","Filtering"],"prompt":"From <code>transactions<\/code>, restricted to txn_type = 'booking' and txn_ts in the first half of 2025 (2025-01-01 through 2025-06-30 inclusive), return per guest:\n\n- txn_count\n- total_amount (ROUND 2)\n- avg_amount (ROUND 2)\n\nOnly include guests with 2 or more qualifying transactions.\n\nColumns: guest_id, txn_count, total_amount, avg_amount\n\nFollow-up to think about out loud: how would you parameterise the date range and the txn_type so this becomes one reusable query?","starter":"SELECT ...","solution":"SELECT guest_id,\n       COUNT(*) AS txn_count,\n       ROUND(SUM(amount), 2) AS total_amount,\n       ROUND(AVG(amount), 2) AS avg_amount\nFROM transactions\nWHERE txn_type = 'booking'\n  AND date(txn_ts) BETWEEN '2025-01-01' AND '2025-06-30'\nGROUP BY guest_id\nHAVING COUNT(*) >= 2"},{"id":"S06","title":"First-time bookers per month, including months absent from the fact table","origin":"ORIGINAL","source":"LeetCode Discuss - Airbnb Senior Data Engineer (Bangalore) full loop write-up - onsite SQL round: report of unique users who booked for the first time in a given month 'even if the month wasn't there in the fact table'. Solved with a recursive CTE.","category":"Cohorts","difficulty":"Hard","tags":["Recursive CTE","Calendar Spine","Left Join"],"prompt":"Build a month spine covering 2024-10 through 2025-12 with a recursive CTE (do not hardcode 15 literal rows).\n\nLeft join first-ever bookings onto that spine so months with no first-time bookers still appear with a zero.\n\nColumns: booking_month (YYYY-MM), first_time_guests","starter":"WITH RECURSIVE months AS (\n  SELECT '2024-10-01' AS m\n  UNION ALL\n  ...\n)\nSELECT ...","solution":"WITH RECURSIVE months AS (\n  SELECT '2024-10-01' AS m\n  UNION ALL\n  SELECT date(m, '+1 month') FROM months WHERE m < '2025-12-01'\n),\nfirsts AS (\n  SELECT guest_id, MIN(booked_at) AS first_booked_at\n  FROM bookings\n  GROUP BY guest_id\n),\nagg AS (\n  SELECT strftime('%Y-%m', first_booked_at) AS booking_month, COUNT(*) AS c\n  FROM firsts\n  GROUP BY 1\n)\nSELECT strftime('%Y-%m', m) AS booking_month,\n       COALESCE(a.c, 0) AS first_time_guests\nFROM months\nLEFT JOIN agg a ON a.booking_month = strftime('%Y-%m', months.m)"},{"id":"S07","title":"Data quality checks on the bookings table","origin":"ORIGINAL","source":"LeetCode Discuss - Airbnb Senior Data Engineer (Bangalore) full loop write-up - onsite SQL round closer: 'data issues and checks I will apply on the data' (duplicates, referential integrity, constraints, NULLs, business rules).","category":"Data Quality","difficulty":"Medium","tags":["UNION ALL","Assertions","Anti-Join"],"prompt":"Write one query that returns a row per check with the number of offending rows. Implement exactly these six checks, using these exact check_name values:\n\n- 'dup_guest_listing_checkin' - more than one booking sharing (guest_id, listing_id, check_in). Count the extra rows, not the groups.\n- 'null_key' - booking_id, guest_id or listing_id is NULL\n- 'checkout_not_after_checkin' - check_out <= check_in\n- 'orphan_listing' - listing_id has no match in listings\n- 'nonpositive_amount' - total_amount is NULL or <= 0\n- 'cancelled_without_timestamp' - status = 'cancelled' but cancelled_at IS NULL\n\nColumns: check_name, failing_rows","starter":"SELECT 'dup_guest_listing_checkin' AS check_name, ... \nUNION ALL\n...","solution":"SELECT 'dup_guest_listing_checkin' AS check_name,\n       COALESCE(SUM(c - 1), 0) AS failing_rows\nFROM (SELECT COUNT(*) AS c FROM bookings\n      GROUP BY guest_id, listing_id, check_in HAVING COUNT(*) > 1)\nUNION ALL\nSELECT 'null_key', COUNT(*) FROM bookings\n WHERE booking_id IS NULL OR guest_id IS NULL OR listing_id IS NULL\nUNION ALL\nSELECT 'checkout_not_after_checkin', COUNT(*) FROM bookings WHERE check_out <= check_in\nUNION ALL\nSELECT 'orphan_listing', COUNT(*) FROM bookings b\n WHERE NOT EXISTS (SELECT 1 FROM listings l WHERE l.listing_id = b.listing_id)\nUNION ALL\nSELECT 'nonpositive_amount', COUNT(*) FROM bookings\n WHERE total_amount IS NULL OR total_amount <= 0\nUNION ALL\nSELECT 'cancelled_without_timestamp', COUNT(*) FROM bookings\n WHERE status = 'cancelled' AND cancelled_at IS NULL"},{"id":"S08","title":"Is this listing priced above the same day last week?","origin":"ORIGINAL","source":"LeetCode Discuss - Airbnb Senior Data Engineer (Bangalore) full loop write-up - onsite whiteboard/SQL round: 'SQL for a feature of the website which told if a given property was priced more or less than the previous week same day', expressed as a percent.","category":"Pricing","difficulty":"Medium","tags":["LAG","Window","Pricing"],"prompt":"price_history holds one row per listing per day.\n\nFor every listing/day where a price exactly 7 days earlier exists, return the current price, that prior price, the percent change, and a direction label ('up', 'down' or 'flat').\n\npct_change = (price - price_7d_ago) / price_7d_ago * 100, ROUND 2. Treat a pct_change of exactly 0 as 'flat'.\n\nColumns: listing_id, dt, price, price_7d_ago, pct_change, direction","starter":"SELECT ...","solution":"WITH p AS (\n  SELECT listing_id, dt, price,\n         LAG(price, 7) OVER (PARTITION BY listing_id ORDER BY dt) AS price_7d_ago\n  FROM price_history\n)\nSELECT listing_id, dt, price, price_7d_ago,\n       ROUND((price - price_7d_ago) * 100.0 / price_7d_ago, 2) AS pct_change,\n       CASE WHEN price > price_7d_ago THEN 'up'\n            WHEN price < price_7d_ago THEN 'down'\n            ELSE 'flat' END AS direction\nFROM p\nWHERE price_7d_ago IS NOT NULL"},{"id":"S09","title":"Guest feature table from booking history","origin":"ORIGINAL","source":"LeetCode Discuss - Airbnb Senior Data Engineer (Bangalore) full loop write-up - onsite round: 'prepare another feature using the booking history of the user'. The candidate could not recall the exact spec, so the feature set here is representative.","category":"Feature Engineering","difficulty":"Hard","tags":["Aggregation","Mode","Recency"],"prompt":"Build a guest feature row for every guest with at least 3 non-cancelled bookings. Treat 2025-12-31 as 'today'.\n\n- bookings_count, distinct_markets, avg_nights (ROUND 2)\n- total_spend (ROUND 2)\n- days_since_last_booking - days between the latest booked_at and 2025-12-31\n- top_market - the market with the most bookings for that guest; break ties alphabetically\n\nColumns: guest_id, bookings_count, distinct_markets, avg_nights, total_spend, days_since_last_booking, top_market","starter":"SELECT ...","solution":"WITH b AS (\n  SELECT bk.*, l.market\n  FROM bookings bk JOIN listings l ON l.listing_id = bk.listing_id\n  WHERE bk.status <> 'cancelled'\n),\nbase AS (\n  SELECT guest_id,\n         COUNT(*) AS bookings_count,\n         COUNT(DISTINCT market) AS distinct_markets,\n         ROUND(AVG(nights), 2) AS avg_nights,\n         ROUND(SUM(total_amount), 2) AS total_spend,\n         CAST(julianday('2025-12-31') - julianday(MAX(booked_at)) AS INTEGER) AS days_since_last_booking\n  FROM b GROUP BY guest_id HAVING COUNT(*) >= 3\n),\nranked AS (\n  SELECT guest_id, market,\n         ROW_NUMBER() OVER (PARTITION BY guest_id ORDER BY COUNT(*) DESC, market) AS rn\n  FROM b GROUP BY guest_id, market\n)\nSELECT base.guest_id, bookings_count, distinct_markets, avg_nights, total_spend,\n       days_since_last_booking, ranked.market AS top_market\nFROM base JOIN ranked ON ranked.guest_id = base.guest_id AND ranked.rn = 1"},{"id":"S10","title":"Order addresses","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - featured SQL question 'Order Addresses'. Title and difficulty reported; statement reconstructed against this schema.","category":"Joins","difficulty":"Medium","tags":["Left Join","Dedup","Priority Pick"],"prompt":"Attach a delivery address to every completed booking.\n\nA guest may have several addresses. Pick the one flagged is_primary = 1; if a guest has none flagged, fall back to their lowest address_id. Guests with no address at all still appear, with NULLs.\n\nColumns: booking_id, guest_id, address_line, city","starter":"SELECT ...","solution":"WITH pick AS (\n  SELECT guest_id, address_line, city,\n         ROW_NUMBER() OVER (PARTITION BY guest_id\n                            ORDER BY is_primary DESC, address_id) AS rn\n  FROM guest_addresses\n)\nSELECT b.booking_id, b.guest_id, p.address_line, p.city\nFROM bookings b\nLEFT JOIN pick p ON p.guest_id = b.guest_id AND p.rn = 1\nWHERE b.status = 'completed'"},{"id":"S11","title":"Trial user segmentation","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Trial User Segmentation' reported by candidates; statement reconstructed as a new-guest activation split.","category":"Cohorts","difficulty":"Medium","tags":["Segmentation","CASE","Rates"],"prompt":"Segment every guest by what they did in their first 30 days after signup_date (day 0 through day 30 inclusive), based on booked_at:\n\n- 'activated' - at least one non-cancelled booking in the window\n- 'cancelled_only' - bookings in the window, but all of them cancelled\n- 'no_booking' - no bookings in the window\n\nReturn the guest count per segment and the share of all guests, as a percent rounded to 2 decimals.\n\nColumns: segment, guests, pct_of_all","starter":"SELECT ...","solution":"WITH w AS (\n  SELECT g.guest_id,\n         SUM(CASE WHEN b.booking_id IS NOT NULL AND b.status <> 'cancelled' THEN 1 ELSE 0 END) AS good,\n         SUM(CASE WHEN b.booking_id IS NOT NULL THEN 1 ELSE 0 END) AS any_b\n  FROM guests g\n  LEFT JOIN bookings b\n    ON b.guest_id = g.guest_id\n   AND date(b.booked_at) BETWEEN g.signup_date AND date(g.signup_date, '+30 day')\n  GROUP BY g.guest_id\n),\nseg AS (\n  SELECT CASE WHEN good > 0 THEN 'activated'\n              WHEN any_b > 0 THEN 'cancelled_only'\n              ELSE 'no_booking' END AS segment\n  FROM w\n)\nSELECT segment, COUNT(*) AS guests,\n       ROUND(100.0 * COUNT(*) / (SELECT COUNT(*) FROM guests), 2) AS pct_of_all\nFROM seg GROUP BY segment"},{"id":"S12","title":"Listing bookings aggregation","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Listing Bookings Aggregation' reported by candidates; statement reconstructed against this schema.","category":"Marketplace Metrics","difficulty":"Medium","tags":["Conditional Aggregation","Rates"],"prompt":"For every active listing that has at least one booking, return the booking mix and the cancellation rate.\n\ncancellation_rate = cancelled bookings / total bookings, ROUND 4. Revenue counts only completed bookings.\n\nColumns: listing_id, market, total_bookings, completed_bookings, cancelled_bookings, nights_sold (completed only), revenue (ROUND 2, completed only), cancellation_rate","starter":"SELECT ...","solution":"SELECT l.listing_id,\n       l.market,\n       COUNT(*) AS total_bookings,\n       SUM(CASE WHEN b.status = 'completed' THEN 1 ELSE 0 END) AS completed_bookings,\n       SUM(CASE WHEN b.status = 'cancelled' THEN 1 ELSE 0 END) AS cancelled_bookings,\n       SUM(CASE WHEN b.status = 'completed' THEN b.nights ELSE 0 END) AS nights_sold,\n       ROUND(SUM(CASE WHEN b.status = 'completed' THEN b.total_amount ELSE 0 END), 2) AS revenue,\n       ROUND(1.0 * SUM(CASE WHEN b.status = 'cancelled' THEN 1 ELSE 0 END) / COUNT(*), 4) AS cancellation_rate\nFROM listings l\nJOIN bookings b ON b.listing_id = l.listing_id\nWHERE l.status = 'active'\nGROUP BY l.listing_id, l.market"},{"id":"S13","title":"Payment data pipeline reconciliation","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Payment Data Pipeline' reported by candidates; statement reconstructed as a booking-level payment reconciliation.","category":"Payments","difficulty":"Hard","tags":["Reconciliation","Conditional Aggregation","Retries"],"prompt":"A booking can have several payment attempts: captures, refunds and failures, plus retries after a failure.\n\nFor every booking that has at least one payment row, return:\n\n- attempts - all payment rows\n- failed_attempts\n- net_amount - sum of captured amounts minus sum of refunded amounts, ROUND 2\n- retry_success - 1 if the booking has at least one 'failed' row AND at least one 'captured' row, else 0\n\nColumns: booking_id, attempts, failed_attempts, net_amount, retry_success","starter":"SELECT ...","solution":"SELECT booking_id,\n       COUNT(*) AS attempts,\n       SUM(CASE WHEN status = 'failed' THEN 1 ELSE 0 END) AS failed_attempts,\n       ROUND(SUM(CASE WHEN status = 'captured' THEN amount\n                      WHEN status = 'refunded' THEN -amount\n                      ELSE 0 END), 2) AS net_amount,\n       CASE WHEN SUM(CASE WHEN status = 'failed' THEN 1 ELSE 0 END) > 0\n             AND SUM(CASE WHEN status = 'captured' THEN 1 ELSE 0 END) > 0\n            THEN 1 ELSE 0 END AS retry_success\nFROM payments\nGROUP BY booking_id"},{"id":"S14","title":"Daily aggregation for the pipeline","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Data Pipelines and Aggregation' reported by candidates; statement reconstructed as the daily rollup such a pipeline would emit.","category":"ETL","difficulty":"Medium","tags":["Daily Rollup","Lead Time"],"prompt":"Produce the daily booking rollup for June 2025, keyed on the date of booked_at. Exclude cancelled bookings.\n\nlead_time_days = check_in minus the date part of booked_at.\n\nColumns: dt (YYYY-MM-DD), bookings, unique_guests, gross_booking_value (ROUND 2), avg_lead_time_days (ROUND 2)","starter":"SELECT ...","solution":"SELECT date(booked_at) AS dt,\n       COUNT(*) AS bookings,\n       COUNT(DISTINCT guest_id) AS unique_guests,\n       ROUND(SUM(total_amount), 2) AS gross_booking_value,\n       ROUND(AVG(julianday(check_in) - julianday(date(booked_at))), 2) AS avg_lead_time_days\nFROM bookings\nWHERE status <> 'cancelled'\n  AND date(booked_at) BETWEEN '2025-06-01' AND '2025-06-30'\nGROUP BY 1"},{"id":"S15","title":"Rolling bank transactions","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Rolling Bank Transactions' reported by candidates; statement reconstructed against the transactions table.","category":"Windows","difficulty":"Medium","tags":["Running Total","Window"],"prompt":"For guests 1 through 10, return every transaction in time order along with the guest's running balance up to and including that transaction.\n\nColumns: guest_id, txn_ts, amount, running_balance (ROUND 2)","starter":"SELECT ...","solution":"SELECT guest_id, txn_ts, amount,\n       ROUND(SUM(amount) OVER (PARTITION BY guest_id ORDER BY txn_ts, txn_id\n             ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW), 2) AS running_balance\nFROM transactions\nWHERE guest_id BETWEEN 1 AND 10"},{"id":"S16","title":"Download facts","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Download Facts' reported by candidates; statement reconstructed against the app_downloads table.","category":"Windows","difficulty":"Medium","tags":["Cumulative","Grouping"],"prompt":"For 2025 only, return app downloads per platform per month plus a cumulative running total per platform.\n\nColumns: platform, dl_month (YYYY-MM), downloads, cumulative_downloads","starter":"SELECT ...","solution":"WITH m AS (\n  SELECT platform, strftime('%Y-%m', download_date) AS dl_month, COUNT(*) AS downloads\n  FROM app_downloads\n  WHERE download_date >= '2025-01-01' AND download_date <= '2025-12-31'\n  GROUP BY 1, 2\n)\nSELECT platform, dl_month, downloads,\n       SUM(downloads) OVER (PARTITION BY platform ORDER BY dl_month\n             ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cumulative_downloads\nFROM m"},{"id":"S17","title":"Month over month","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Month Over Month' reported by candidates; statement reconstructed against booking revenue.","category":"Windows","difficulty":"Medium","tags":["LAG","Growth"],"prompt":"Compute gross booking value per month from non-cancelled bookings (month of booked_at), then the month-over-month percent change.\n\nThe first month has no prior month - return NULL there.\n\nColumns: booking_month (YYYY-MM), gbv (ROUND 2), prev_gbv (ROUND 2), mom_pct (ROUND 2)","starter":"SELECT ...","solution":"WITH m AS (\n  SELECT strftime('%Y-%m', booked_at) AS booking_month,\n         SUM(total_amount) AS gbv\n  FROM bookings\n  WHERE status <> 'cancelled'\n  GROUP BY 1\n)\nSELECT booking_month,\n       ROUND(gbv, 2) AS gbv,\n       ROUND(LAG(gbv) OVER (ORDER BY booking_month), 2) AS prev_gbv,\n       ROUND((gbv - LAG(gbv) OVER (ORDER BY booking_month)) * 100.0\n             / LAG(gbv) OVER (ORDER BY booking_month), 2) AS mom_pct\nFROM m"},{"id":"S18","title":"Average order value by market and month","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Average Order Value' reported by candidates; statement reconstructed against completed bookings.","category":"Marketplace Metrics","difficulty":"Easy","tags":["AOV","Grouping"],"prompt":"For completed bookings only, return average order value by market and by month of check_in. Only include market-months with at least 3 bookings.\n\nColumns: market, stay_month (YYYY-MM), bookings, aov (ROUND 2)","starter":"SELECT ...","solution":"SELECT l.market,\n       strftime('%Y-%m', b.check_in) AS stay_month,\n       COUNT(*) AS bookings,\n       ROUND(AVG(b.total_amount), 2) AS aov\nFROM bookings b\nJOIN listings l ON l.listing_id = b.listing_id\nWHERE b.status = 'completed'\nGROUP BY 1, 2\nHAVING COUNT(*) >= 3"},{"id":"S19","title":"Top 3 users per market","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Top 3 Users' reported by candidates; statement reconstructed as top spenders per market.","category":"Windows","difficulty":"Medium","tags":["ROW_NUMBER","Top N per Group"],"prompt":"Rank guests by completed-booking spend inside each market and keep the top 3 per market. Break ties by guest_id ascending.\n\nColumns: market, guest_id, total_spend (ROUND 2), rn","starter":"SELECT ...","solution":"WITH s AS (\n  SELECT l.market, b.guest_id, SUM(b.total_amount) AS total_spend\n  FROM bookings b JOIN listings l ON l.listing_id = b.listing_id\n  WHERE b.status = 'completed'\n  GROUP BY 1, 2\n),\nr AS (\n  SELECT market, guest_id, total_spend,\n         ROW_NUMBER() OVER (PARTITION BY market ORDER BY total_spend DESC, guest_id) AS rn\n  FROM s\n)\nSELECT market, guest_id, ROUND(total_spend, 2) AS total_spend, rn\nFROM r WHERE rn <= 3"},{"id":"S20","title":"Third purchase","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Third Purchase' reported by candidates; statement reconstructed against bookings.","category":"Windows","difficulty":"Medium","tags":["ROW_NUMBER","Nth Event"],"prompt":"For each guest who has made at least 3 non-cancelled bookings, return that guest's third booking in booked_at order (tie-break on booking_id).\n\nColumns: guest_id, booking_id, booked_at, total_amount","starter":"SELECT ...","solution":"WITH r AS (\n  SELECT guest_id, booking_id, booked_at, total_amount,\n         ROW_NUMBER() OVER (PARTITION BY guest_id ORDER BY booked_at, booking_id) AS rn\n  FROM bookings\n  WHERE status <> 'cancelled'\n)\nSELECT guest_id, booking_id, booked_at, total_amount\nFROM r WHERE rn = 3"},{"id":"S21","title":"Monthly customer report","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Monthly Customer Report' reported by candidates; statement reconstructed as a new-vs-returning monthly report.","category":"Cohorts","difficulty":"Hard","tags":["New vs Returning","First Event"],"prompt":"For every month with activity, split active guests into new and returning.\n\nA guest is 'new' in the month their first-ever non-cancelled booking falls, and 'returning' in any later month they book. Revenue is the sum of total_amount for non-cancelled bookings in that month (month of booked_at).\n\nColumns: booking_month (YYYY-MM), active_guests, new_guests, returning_guests, revenue (ROUND 2)","starter":"SELECT ...","solution":"WITH b AS (\n  SELECT guest_id, booking_id, total_amount,\n         strftime('%Y-%m', booked_at) AS booking_month\n  FROM bookings WHERE status <> 'cancelled'\n),\nfirsts AS (\n  SELECT guest_id, MIN(booking_month) AS first_month FROM b GROUP BY guest_id\n),\nper_guest AS (\n  SELECT DISTINCT b.booking_month, b.guest_id,\n         CASE WHEN b.booking_month = f.first_month THEN 1 ELSE 0 END AS is_new\n  FROM b JOIN firsts f ON f.guest_id = b.guest_id\n),\nrev AS (\n  SELECT booking_month, SUM(total_amount) AS revenue FROM b GROUP BY 1\n)\nSELECT p.booking_month,\n       COUNT(*) AS active_guests,\n       SUM(is_new) AS new_guests,\n       SUM(1 - is_new) AS returning_guests,\n       ROUND(r.revenue, 2) AS revenue\nFROM per_guest p JOIN rev r ON r.booking_month = p.booking_month\nGROUP BY p.booking_month, r.revenue"},{"id":"S22","title":"Over-budget projects","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Over-Budget Projects' reported by candidates; the classic prorated-salary formulation.","category":"Joins","difficulty":"Hard","tags":["Proration","Many-to-Many"],"prompt":"A project's cost is the sum of the salaries of everyone assigned to it, prorated over the project's duration: cost = SUM(salary) * (days between start_date and end_date) / 365.0.\n\nReturn every project with its budget, its prorated cost rounded to 2 decimals, and a flag for whether cost exceeds budget. Projects with nobody assigned have a cost of 0.\n\nColumns: project_name, budget, cost, over_budget (1 or 0)","starter":"SELECT ...","solution":"WITH c AS (\n  SELECT p.project_id, p.project_name, p.budget,\n         (julianday(p.end_date) - julianday(p.start_date)) / 365.0 AS frac,\n         COALESCE(SUM(e.salary), 0) AS sal\n  FROM projects p\n  LEFT JOIN employee_projects ep ON ep.project_id = p.project_id\n  LEFT JOIN employees e ON e.employee_id = ep.employee_id\n  GROUP BY p.project_id, p.project_name, p.budget, frac\n)\nSELECT project_name, budget,\n       ROUND(sal * frac, 2) AS cost,\n       CASE WHEN sal * frac > budget THEN 1 ELSE 0 END AS over_budget\nFROM c"},{"id":"S23","title":"Reproducible random sample","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Random SQL Sample' reported by candidates; statement reconstructed as a deterministic-sampling exercise.","category":"Sampling","difficulty":"Medium","tags":["Determinism","Modulo Bucketing"],"prompt":"Pull a repeatable ~20% sample of guests. The same query run tomorrow must return the same guests, so RANDOM() is not acceptable.\n\nUse a modulo bucket on guest_id: keep guests where guest_id % 5 = 2. Return them with their signup month.\n\nColumns: guest_id, signup_month (YYYY-MM)\n\nWorth saying out loud: modulo on a sequential id is only unbiased if the id carries no signal. What would you use instead in production?","starter":"SELECT ...","solution":"SELECT guest_id, strftime('%Y-%m', signup_date) AS signup_month\nFROM guests\nWHERE guest_id % 5 = 2"},{"id":"S24","title":"Second highest salary per department","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question '2nd Highest Salary' reported by candidates; extended to the per-department variant that usually follows.","category":"Windows","difficulty":"Medium","tags":["DENSE_RANK","Distinct Values"],"prompt":"For every department, return the second highest <b>distinct<\/b> salary. Departments with fewer than 2 distinct salaries are omitted.\n\nColumns: department, second_highest_salary","starter":"SELECT ...","solution":"WITH d AS (\n  SELECT DISTINCT department, salary FROM employees\n),\nr AS (\n  SELECT department, salary,\n         DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS rk\n  FROM d\n)\nSELECT department, salary AS second_highest_salary\nFROM r WHERE rk = 2"},{"id":"S25","title":"Employees earning more than their manager","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Employee Salaries' reported by candidates; the standard self-join formulation.","category":"Joins","difficulty":"Easy","tags":["Self Join"],"prompt":"Return every employee whose salary is strictly greater than their manager's salary. Employees without a manager are excluded.\n\nColumns: employee_name, salary, manager_name, manager_salary","starter":"SELECT ...","solution":"SELECT e.employee_name, e.salary,\n       m.employee_name AS manager_name, m.salary AS manager_salary\nFROM employees e\nJOIN employees m ON m.employee_id = e.manager_id\nWHERE e.salary > m.salary"},{"id":"S26","title":"User experience percentage by device","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'User Experience Percentage' reported by candidates; statement reconstructed on the search event stream.","category":"Funnels","difficulty":"Medium","tags":["Conditional Aggregation","Session Grain"],"prompt":"Roll the search event stream up to session grain, then report per device:\n\n- sessions\n- pct_viewed - share of sessions containing a 'view'\n- pct_booked - share of sessions containing a 'book'\n\nBoth percentages rounded to 2 decimals, expressed 0-100.\n\nColumns: device, sessions, pct_viewed, pct_booked","starter":"SELECT ...","solution":"WITH s AS (\n  SELECT session_id,\n         MAX(device) AS device,\n         MAX(CASE WHEN event_type = 'view' THEN 1 ELSE 0 END) AS viewed,\n         MAX(CASE WHEN event_type = 'book' THEN 1 ELSE 0 END) AS booked\n  FROM search_events\n  GROUP BY session_id\n)\nSELECT device,\n       COUNT(*) AS sessions,\n       ROUND(100.0 * SUM(viewed) / COUNT(*), 2) AS pct_viewed,\n       ROUND(100.0 * SUM(booked) / COUNT(*), 2) AS pct_booked\nFROM s GROUP BY device"},{"id":"S27","title":"Approval drop by processor","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Approval Drop' reported by candidates; statement reconstructed as a payment approval-rate regression check.","category":"Payments","difficulty":"Hard","tags":["LAG","Rates","Root Cause"],"prompt":"Approval rate = captured payments / all payment attempts, per processor per month (month of created_at).\n\nReturn each processor-month's approval rate and the change in percentage points versus that processor's previous month.\n\nColumns: processor, pay_month (YYYY-MM), attempts, approval_rate (ROUND 4), prev_approval_rate (ROUND 4), delta_pp (ROUND 4)","starter":"SELECT ...","solution":"WITH m AS (\n  SELECT processor, strftime('%Y-%m', created_at) AS pay_month,\n         COUNT(*) AS attempts,\n         1.0 * SUM(CASE WHEN status = 'captured' THEN 1 ELSE 0 END) / COUNT(*) AS approval_rate\n  FROM payments\n  GROUP BY 1, 2\n)\nSELECT processor, pay_month, attempts,\n       ROUND(approval_rate, 4) AS approval_rate,\n       ROUND(LAG(approval_rate) OVER (PARTITION BY processor ORDER BY pay_month), 4) AS prev_approval_rate,\n       ROUND(approval_rate - LAG(approval_rate) OVER (PARTITION BY processor ORDER BY pay_month), 4) AS delta_pp\nFROM m"},{"id":"S28","title":"Causal email journey","origin":"ORIGINAL","source":"Interview Query - Airbnb Data Engineer guide, question list from candidate reports (updated Jul 2026) - question 'Causal Email Journey' reported by candidates; statement reconstructed as click-attributed booking measurement.","category":"Attribution","difficulty":"Hard","tags":["Attribution Window","EXISTS","Rates"],"prompt":"For each campaign report sends, open rate, click rate, and click-attributed bookings.\n\nA booking is attributed to a click when the same guest has a non-cancelled booking with booked_at strictly after clicked_at and within 7 days of it. Count distinct bookings.\n\nRates are 0-1, rounded to 4 decimals.\n\nColumns: campaign, sends, open_rate, click_rate, attributed_bookings\n\nWorth saying out loud: this measures correlation, not causality. What would you need for the causal claim?","starter":"SELECT ...","solution":"WITH e AS (\n  SELECT campaign,\n         COUNT(*) AS sends,\n         SUM(CASE WHEN opened_at IS NOT NULL THEN 1 ELSE 0 END) AS opens,\n         SUM(CASE WHEN clicked_at IS NOT NULL THEN 1 ELSE 0 END) AS clicks\n  FROM email_sends GROUP BY campaign\n),\natt AS (\n  SELECT s.campaign, COUNT(DISTINCT b.booking_id) AS attributed_bookings\n  FROM email_sends s\n  JOIN bookings b\n    ON b.guest_id = s.guest_id\n   AND b.status <> 'cancelled'\n   AND b.booked_at > s.clicked_at\n   AND julianday(b.booked_at) - julianday(s.clicked_at) <= 7\n  WHERE s.clicked_at IS NOT NULL\n  GROUP BY s.campaign\n)\nSELECT e.campaign, e.sends,\n       ROUND(1.0 * e.opens / e.sends, 4) AS open_rate,\n       ROUND(1.0 * e.clicks / e.sends, 4) AS click_rate,\n       COALESCE(att.attributed_bookings, 0) AS attributed_bookings\nFROM e LEFT JOIN att ON att.campaign = e.campaign"},{"id":"S29","title":"Search to view to click to book funnel","origin":"ORIGINAL","source":"DataVidhya - Airbnb DE interview guide, sample question at round difficulty (May 2026) - listed as a core SQL-round pattern: 'search to view to book to complete, conditional aggregation with CASE WHEN'.","category":"Funnels","difficulty":"Medium","tags":["Funnel","Step Conversion"],"prompt":"Build the session funnel by market: sessions that searched, viewed, clicked, booked, plus each step-to-step conversion rate (rounded to 4 decimals, 0-1).\n\nA session belongs to the market on its rows (it is constant within a session).\n\nColumns: market, searched, viewed, clicked, booked, search_to_view, view_to_click, click_to_book","starter":"SELECT ...","solution":"WITH s AS (\n  SELECT session_id, MAX(market) AS market,\n         MAX(CASE WHEN event_type = 'search' THEN 1 ELSE 0 END) AS searched,\n         MAX(CASE WHEN event_type = 'view'   THEN 1 ELSE 0 END) AS viewed,\n         MAX(CASE WHEN event_type = 'click'  THEN 1 ELSE 0 END) AS clicked,\n         MAX(CASE WHEN event_type = 'book'   THEN 1 ELSE 0 END) AS booked\n  FROM search_events GROUP BY session_id\n)\nSELECT market,\n       SUM(searched) AS searched,\n       SUM(viewed) AS viewed,\n       SUM(clicked) AS clicked,\n       SUM(booked) AS booked,\n       ROUND(1.0 * SUM(viewed)  / SUM(searched), 4) AS search_to_view,\n       ROUND(1.0 * SUM(clicked) / SUM(viewed), 4)   AS view_to_click,\n       ROUND(1.0 * SUM(booked)  / SUM(clicked), 4)  AS click_to_book\nFROM s GROUP BY market"},{"id":"S30","title":"Guest retention by signup cohort","origin":"ORIGINAL","source":"DataVidhya - Airbnb DE interview guide, sample question at round difficulty (May 2026) - listed as a core SQL-round pattern: 'guest retention by signup month, repeat booking by acquisition cohort'.","category":"Cohorts","difficulty":"Hard","tags":["Cohort Matrix","Months Since"],"prompt":"Cohort guests by signup month. For months-since-signup 0, 1, 2 and 3, count how many guests from each cohort made a non-cancelled booking in that offset month.\n\nmonths_since = 12 * (booking year - signup year) + (booking month - signup month). Keep only offsets 0-3 and drop negatives.\n\nColumns: cohort_month (YYYY-MM), months_since, cohort_size, active_guests\n\ncohort_size is the total number of guests in the cohort, repeated on each row.","starter":"SELECT ...","solution":"WITH sizes AS (\n  SELECT strftime('%Y-%m', signup_date) AS cohort_month, COUNT(*) AS cohort_size\n  FROM guests GROUP BY 1\n),\nact AS (\n  SELECT strftime('%Y-%m', g.signup_date) AS cohort_month,\n         (CAST(strftime('%Y', b.booked_at) AS INTEGER) - CAST(strftime('%Y', g.signup_date) AS INTEGER)) * 12\n       + (CAST(strftime('%m', b.booked_at) AS INTEGER) - CAST(strftime('%m', g.signup_date) AS INTEGER)) AS months_since,\n         b.guest_id\n  FROM guests g\n  JOIN bookings b ON b.guest_id = g.guest_id AND b.status <> 'cancelled'\n)\nSELECT a.cohort_month, a.months_since, s.cohort_size,\n       COUNT(DISTINCT a.guest_id) AS active_guests\nFROM act a JOIN sizes s ON s.cohort_month = a.cohort_month\nWHERE a.months_since BETWEEN 0 AND 3\nGROUP BY a.cohort_month, a.months_since, s.cohort_size"},{"id":"S31","title":"Host response rate within 24 hours","origin":"PRACTICE","source":"Aligned with the marketplace-metric vocabulary Airbnb expects (host response rate).","category":"Marketplace Metrics","difficulty":"Medium","tags":["Rates","NULL Handling","Date Arithmetic"],"prompt":"An inquiry is 'answered in time' when first_response_at is not null and lands within 24 hours of sent_at. Unanswered inquiries count against the host.\n\nPer market, return inquiries, answered_in_24h, and the response rate (0-1, ROUND 4). Only markets with 20 or more inquiries.\n\nColumns: market, inquiries, answered_in_24h, response_rate_24h","starter":"SELECT ...","solution":"SELECT h.market,\n       COUNT(*) AS inquiries,\n       SUM(CASE WHEN i.first_response_at IS NOT NULL\n                 AND julianday(i.first_response_at) - julianday(i.sent_at) <= 1.0\n                THEN 1 ELSE 0 END) AS answered_in_24h,\n       ROUND(1.0 * SUM(CASE WHEN i.first_response_at IS NOT NULL\n                 AND julianday(i.first_response_at) - julianday(i.sent_at) <= 1.0\n                THEN 1 ELSE 0 END) / COUNT(*), 4) AS response_rate_24h\nFROM inquiries i JOIN hosts h ON h.host_id = i.host_id\nGROUP BY h.market HAVING COUNT(*) >= 20"},{"id":"S32","title":"Repeat booking rate within 90 days","origin":"PRACTICE","source":"Aligned with 'repeat booking rate' in the metric vocabulary for the SQL and business-acumen rounds.","category":"Cohorts","difficulty":"Hard","tags":["Self Join","Windowed Window","Retention"],"prompt":"Take each guest's first non-cancelled booking. The guest 'repeats' if they have another non-cancelled booking with booked_at strictly after the first one and within 90 days of it.\n\nReport the repeat rate by acquisition_channel.\n\nColumns: acquisition_channel, guests, repeaters, repeat_rate_90d (ROUND 4)","starter":"SELECT ...","solution":"WITH f AS (\n  SELECT guest_id, MIN(booked_at) AS first_at\n  FROM bookings WHERE status <> 'cancelled' GROUP BY guest_id\n),\nrep AS (\n  SELECT f.guest_id,\n         MAX(CASE WHEN b.booked_at > f.first_at\n                   AND julianday(b.booked_at) - julianday(f.first_at) <= 90\n                  THEN 1 ELSE 0 END) AS repeated\n  FROM f JOIN bookings b ON b.guest_id = f.guest_id AND b.status <> 'cancelled'\n  GROUP BY f.guest_id\n)\nSELECT g.acquisition_channel,\n       COUNT(*) AS guests,\n       SUM(rep.repeated) AS repeaters,\n       ROUND(1.0 * SUM(rep.repeated) / COUNT(*), 4) AS repeat_rate_90d\nFROM rep JOIN guests g ON g.guest_id = rep.guest_id\nGROUP BY g.acquisition_channel"},{"id":"S33","title":"Length-of-stay buckets","origin":"PRACTICE","source":"Aligned with the date-arithmetic-on-travel-data pattern (length of stay).","category":"Marketplace Metrics","difficulty":"Easy","tags":["CASE","Bucketing"],"prompt":"Bucket non-cancelled bookings by nights: 1 = '1 night', 2-3 = 'short', 4-6 = 'medium', 7+ = 'long'.\n\nColumns: los_bucket, bookings, nights_sold, avg_amount (ROUND 2)","starter":"SELECT ...","solution":"SELECT CASE WHEN nights = 1 THEN '1 night'\n            WHEN nights BETWEEN 2 AND 3 THEN 'short'\n            WHEN nights BETWEEN 4 AND 6 THEN 'medium'\n            ELSE 'long' END AS los_bucket,\n       COUNT(*) AS bookings,\n       SUM(nights) AS nights_sold,\n       ROUND(AVG(total_amount), 2) AS avg_amount\nFROM bookings WHERE status <> 'cancelled'\nGROUP BY 1"},{"id":"S34","title":"Booking lead time quartiles by market","origin":"PRACTICE","source":"Aligned with the booking-lead-time pattern called out for the SQL round.","category":"Windows","difficulty":"Medium","tags":["NTILE","Percentiles"],"prompt":"lead_time_days = check_in minus the date of booked_at, for non-cancelled bookings.\n\nSplit each market's bookings into 4 quartiles by lead time (NTILE), then return the min and max lead time in each quartile.\n\nColumns: market, quartile, bookings, min_lead, max_lead","starter":"SELECT ...","solution":"WITH lt AS (\n  SELECT l.market,\n         CAST(julianday(b.check_in) - julianday(date(b.booked_at)) AS INTEGER) AS lead_time_days\n  FROM bookings b JOIN listings l ON l.listing_id = b.listing_id\n  WHERE b.status <> 'cancelled'\n),\nq AS (\n  SELECT market, lead_time_days,\n         NTILE(4) OVER (PARTITION BY market ORDER BY lead_time_days) AS quartile\n  FROM lt\n)\nSELECT market, quartile, COUNT(*) AS bookings,\n       MIN(lead_time_days) AS min_lead, MAX(lead_time_days) AS max_lead\nFROM q GROUP BY market, quartile"},{"id":"S35","title":"Nightly revenue recognition by market","origin":"PRACTICE","source":"Aligned with the night-grain-vs-booking-grain trap flagged as the top SQL-round mistake.","category":"ETL","difficulty":"Hard","tags":["Night Grain","Recursive CTE","Revenue Spread"],"prompt":"Revenue should be recognised per night stayed, not all on the booking date. Spread each completed booking's total_amount evenly across its nights (total_amount / nights per night).\n\nReturn recognised revenue by market and stay month.\n\nColumns: market, stay_month (YYYY-MM), nights, recognised_revenue (ROUND 2)","starter":"WITH RECURSIVE nights AS (\n  \n)\nSELECT ...","solution":"WITH RECURSIVE nights AS (\n  SELECT booking_id, listing_id, check_in AS dt, check_out,\n         total_amount / nights AS per_night\n  FROM bookings WHERE status = 'completed'\n  UNION ALL\n  SELECT booking_id, listing_id, date(dt, '+1 day'), check_out, per_night\n  FROM nights WHERE date(dt, '+1 day') < check_out\n)\nSELECT l.market,\n       strftime('%Y-%m', n.dt) AS stay_month,\n       COUNT(*) AS nights,\n       ROUND(SUM(n.per_night), 2) AS recognised_revenue\nFROM nights n JOIN listings l ON l.listing_id = n.listing_id\nGROUP BY 1, 2"},{"id":"S36","title":"Occupancy rate from the availability calendar","origin":"PRACTICE","source":"Aligned with fill rate / supply utilisation from the metric vocabulary.","category":"Marketplace Metrics","difficulty":"Medium","tags":["Fill Rate","Denominator Construction"],"prompt":"calendar_availability has one row per listing per day, with is_available and is_booked flags.\n\nOccupancy = booked nights / available nights. A night counts in the denominator when is_available = 1.\n\nReturn only listings with 10 or more available nights.\n\nColumns: listing_id, available_nights, booked_nights, occupancy (ROUND 4)","starter":"SELECT ...","solution":"SELECT listing_id,\n       SUM(is_available) AS available_nights,\n       SUM(CASE WHEN is_available = 1 THEN is_booked ELSE 0 END) AS booked_nights,\n       ROUND(1.0 * SUM(CASE WHEN is_available = 1 THEN is_booked ELSE 0 END)\n             / SUM(is_available), 4) AS occupancy\nFROM calendar_availability\nGROUP BY listing_id\nHAVING SUM(is_available) >= 10"},{"id":"S37","title":"Superhost quality comparison","origin":"PRACTICE","source":"Aligned with the business-acumen prompt 'how would you measure host quality'.","category":"Marketplace Metrics","difficulty":"Medium","tags":["Segment Comparison","Rates"],"prompt":"Compare superhosts against everyone else. For each group return hosts, bookings, cancellation rate, and average review rating (hosts with no reviews simply contribute no ratings).\n\nColumns: host_type ('superhost' or 'standard'), hosts, bookings, cancellation_rate (ROUND 4), avg_rating (ROUND 3)","starter":"SELECT ...","solution":"SELECT CASE WHEN h.is_superhost = 1 THEN 'superhost' ELSE 'standard' END AS host_type,\n       COUNT(DISTINCT h.host_id) AS hosts,\n       COUNT(b.booking_id) AS bookings,\n       ROUND(1.0 * SUM(CASE WHEN b.status = 'cancelled' THEN 1 ELSE 0 END)\n             / COUNT(b.booking_id), 4) AS cancellation_rate,\n       ROUND((SELECT AVG(r.rating) FROM reviews r JOIN hosts h2 ON h2.host_id = r.host_id\n              WHERE h2.is_superhost = h.is_superhost), 3) AS avg_rating\nFROM hosts h JOIN bookings b ON b.host_id = h.host_id\nGROUP BY 1, h.is_superhost"},{"id":"S38","title":"Longest run of consecutive booked nights","origin":"PRACTICE","source":"Gaps-and-islands on the availability calendar; a standard follow-up to occupancy questions.","category":"Windows","difficulty":"Hard","tags":["Gaps and Islands","ROW_NUMBER"],"prompt":"Using calendar_availability, find each listing's longest unbroken run of consecutive days where is_booked = 1.\n\nClassic trick: subtract a row number from the date to make each run share a constant key.\n\nColumns: listing_id, longest_streak","starter":"SELECT ...","solution":"WITH b AS (\n  SELECT listing_id, dt,\n         ROW_NUMBER() OVER (PARTITION BY listing_id ORDER BY dt) AS rn\n  FROM calendar_availability WHERE is_booked = 1\n),\ngrp AS (\n  SELECT listing_id, dt, date(julianday(dt) - rn) AS island FROM b\n),\nruns AS (\n  SELECT listing_id, island, COUNT(*) AS streak\n  FROM grp GROUP BY listing_id, island\n)\nSELECT listing_id, MAX(streak) AS longest_streak\nFROM runs GROUP BY listing_id"},{"id":"S39","title":"Sessionise the search event stream","origin":"PRACTICE","source":"Sessionization from event streams is repeatedly listed as an Airbnb DE SQL pattern.","category":"Funnels","difficulty":"Hard","tags":["Sessionization","LAG","Running Sum"],"prompt":"Ignore the provided session_id. Rebuild sessions from scratch: for each guest, a gap of more than 30 minutes between consecutive events starts a new session.\n\nReturn per guest the number of reconstructed sessions and total events.\n\nColumns: guest_id, sessions, events","starter":"SELECT ...","solution":"WITH e AS (\n  SELECT guest_id, event_ts,\n         LAG(event_ts) OVER (PARTITION BY guest_id ORDER BY event_ts, event_id) AS prev_ts\n  FROM search_events\n),\nflagged AS (\n  SELECT guest_id, event_ts,\n         CASE WHEN prev_ts IS NULL\n               OR (julianday(event_ts) - julianday(prev_ts)) * 24 * 60 > 30\n              THEN 1 ELSE 0 END AS is_new\n  FROM e\n)\nSELECT guest_id, SUM(is_new) AS sessions, COUNT(*) AS events\nFROM flagged GROUP BY guest_id"},{"id":"S40","title":"First-touch market attribution for bookings","origin":"PRACTICE","source":"Aligned with 'search-to-book attribution' in the metric vocabulary.","category":"Attribution","difficulty":"Hard","tags":["First Touch","Attribution Window"],"prompt":"For each session that contains a 'book' event, attribute the booking to the market and device of the session's <b>earliest<\/b> event.\n\nReturn the count of attributed bookings by that first-touch market and device.\n\nColumns: first_market, first_device, booked_sessions","starter":"SELECT ...","solution":"WITH ordered AS (\n  SELECT session_id, market, device, event_type,\n         ROW_NUMBER() OVER (PARTITION BY session_id ORDER BY event_ts, event_id) AS rn\n  FROM search_events\n),\nfirst_touch AS (\n  SELECT session_id, market AS first_market, device AS first_device\n  FROM ordered WHERE rn = 1\n),\nbooked AS (\n  SELECT DISTINCT session_id FROM search_events WHERE event_type = 'book'\n)\nSELECT f.first_market, f.first_device, COUNT(*) AS booked_sessions\nFROM booked b JOIN first_touch f ON f.session_id = b.session_id\nGROUP BY 1, 2"},{"id":"S41","title":"Deduplicate the booking event log","origin":"PRACTICE","source":"Aligned with the ROW_NUMBER-for-dedupe pattern named in the SQL round breakdown.","category":"Data Quality","difficulty":"Medium","tags":["Dedup","ROW_NUMBER"],"prompt":"booking_events contains duplicate rows for the same (booking_id, event_type).\n\nKeep exactly one row per (booking_id, event_type): the one with the latest event_ts, breaking ties on the highest event_id. Return only the bookings that actually had duplicates.\n\nColumns: booking_id, event_type, event_ts, event_id","starter":"SELECT ...","solution":"WITH r AS (\n  SELECT booking_id, event_type, event_ts, event_id,\n         ROW_NUMBER() OVER (PARTITION BY booking_id, event_type\n                            ORDER BY event_ts DESC, event_id DESC) AS rn,\n         COUNT(*) OVER (PARTITION BY booking_id, event_type) AS c\n  FROM booking_events\n)\nSELECT booking_id, event_type, event_ts, event_id\nFROM r WHERE rn = 1 AND c > 1"},{"id":"S42","title":"Out-of-order lifecycle events","origin":"PRACTICE","source":"Aligned with the late-arriving / out-of-order event handling Airbnb probes in both the coding and SQL rounds.","category":"Data Quality","difficulty":"Medium","tags":["Pivot","Assertions"],"prompt":"A booking's lifecycle should run requested -> confirmed -> (cancelled | completed).\n\nFlag every booking where the earliest 'confirmed' event is not strictly after the earliest 'requested' event, or where a 'cancelled' event precedes 'confirmed'.\n\nColumns: booking_id, requested_ts, confirmed_ts, cancelled_ts","starter":"SELECT ...","solution":"WITH p AS (\n  SELECT booking_id,\n         MIN(CASE WHEN event_type = 'requested' THEN event_ts END) AS requested_ts,\n         MIN(CASE WHEN event_type = 'confirmed' THEN event_ts END) AS confirmed_ts,\n         MIN(CASE WHEN event_type = 'cancelled' THEN event_ts END) AS cancelled_ts\n  FROM booking_events GROUP BY booking_id\n)\nSELECT booking_id, requested_ts, confirmed_ts, cancelled_ts\nFROM p\nWHERE (confirmed_ts IS NOT NULL AND requested_ts IS NOT NULL AND confirmed_ts <= requested_ts)\n   OR (cancelled_ts IS NOT NULL AND confirmed_ts IS NOT NULL AND cancelled_ts < confirmed_ts)"},{"id":"S43","title":"Top listing per market with a deterministic tie-break","origin":"PRACTICE","source":"Top-N-per-group with explicit tie handling; a common Airbnb SQL follow-up.","category":"Windows","difficulty":"Medium","tags":["Top N per Group","Ties"],"prompt":"Return the single highest-revenue listing in each market (completed bookings only). If two listings tie on revenue, prefer the one with more completed bookings, then the lower listing_id.\n\nColumns: market, listing_id, completed_bookings, revenue (ROUND 2)","starter":"SELECT ...","solution":"WITH s AS (\n  SELECT l.market, l.listing_id,\n         COUNT(*) AS completed_bookings,\n         SUM(b.total_amount) AS revenue\n  FROM bookings b JOIN listings l ON l.listing_id = b.listing_id\n  WHERE b.status = 'completed'\n  GROUP BY 1, 2\n),\nr AS (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY market\n              ORDER BY revenue DESC, completed_bookings DESC, listing_id) AS rn\n  FROM s\n)\nSELECT market, listing_id, completed_bookings, ROUND(revenue, 2) AS revenue\nFROM r WHERE rn = 1"},{"id":"S44","title":"Guests booking in consecutive months","origin":"PRACTICE","source":"Consecutive-period detection with LAG; standard follow-up to retention questions.","category":"Windows","difficulty":"Hard","tags":["LAG","Consecutive Periods"],"prompt":"Find guests who booked in two calendar months back to back (month N and month N+1), using non-cancelled bookings and the month of booked_at.\n\nReturn one row per guest per qualifying pair.\n\nColumns: guest_id, prev_month (YYYY-MM), curr_month (YYYY-MM)","starter":"SELECT ...","solution":"WITH gm AS (\n  SELECT DISTINCT guest_id, strftime('%Y-%m', booked_at) AS m\n  FROM bookings WHERE status <> 'cancelled'\n),\nl AS (\n  SELECT guest_id, m, LAG(m) OVER (PARTITION BY guest_id ORDER BY m) AS prev_m\n  FROM gm\n)\nSELECT guest_id, prev_m AS prev_month, m AS curr_month\nFROM l\nWHERE prev_m IS NOT NULL\n  AND strftime('%Y-%m', date(prev_m || '-01', '+1 month')) = m"},{"id":"S45","title":"Median nightly price per market","origin":"PRACTICE","source":"Median without a percentile function; a frequent probe when candidates reach for a warehouse-only builtin.","category":"Windows","difficulty":"Hard","tags":["Median","ROW_NUMBER","Portability"],"prompt":"SQLite has no PERCENTILE_CONT. Compute the median nightly_price of active listings per market by hand: order prices within the market, then take the middle value (or the average of the two middle values when the count is even).\n\nColumns: market, listings, median_price (ROUND 2)","starter":"SELECT ...","solution":"WITH r AS (\n  SELECT market, nightly_price,\n         ROW_NUMBER() OVER (PARTITION BY market ORDER BY nightly_price) AS rn,\n         COUNT(*) OVER (PARTITION BY market) AS c\n  FROM listings WHERE status = 'active'\n)\nSELECT market, MAX(c) AS listings,\n       ROUND(AVG(nightly_price), 2) AS median_price\nFROM r\nWHERE rn IN ((c + 1) / 2, (c + 2) / 2)\nGROUP BY market"},{"id":"S46","title":"Detect sharp price moves","origin":"PRACTICE","source":"Aligned with the dynamic-pricing domain used in Airbnb data-modeling and SQL prompts.","category":"Pricing","difficulty":"Medium","tags":["LAG","Thresholds"],"prompt":"Flag every day where a listing's price moved more than 3% against the previous day, in either direction.\n\nabs_pct_change = ABS(price - prev_price) / prev_price * 100.\n\nColumns: listing_id, dt, prev_price, price, abs_pct_change (ROUND 2)","starter":"SELECT ...","solution":"WITH p AS (\n  SELECT listing_id, dt, price,\n         LAG(price) OVER (PARTITION BY listing_id ORDER BY dt) AS prev_price\n  FROM price_history\n)\nSELECT listing_id, dt, prev_price, price,\n       ROUND(ABS(price - prev_price) * 100.0 / prev_price, 2) AS abs_pct_change\nFROM p\nWHERE prev_price IS NOT NULL\n  AND ABS(price - prev_price) * 100.0 / prev_price > 3"},{"id":"S47","title":"Marketplace liquidity by month","origin":"PRACTICE","source":"Aligned with 'liquidity - supply meeting demand' from the metric vocabulary.","category":"Marketplace Metrics","difficulty":"Hard","tags":["Two Sources","Ratio Metrics"],"prompt":"Liquidity here = searches per booked night, by market and month.\n\nNumerator: search events with event_type = 'search', by month of event_ts. Denominator: nights from non-cancelled bookings, by month of check_in. Return only market-months that appear on both sides.\n\nA lower ratio means demand converts into stays more easily.\n\nColumns: market, m (YYYY-MM), searches, booked_nights, searches_per_booked_night (ROUND 3)","starter":"SELECT ...","solution":"WITH s AS (\n  SELECT market, strftime('%Y-%m', event_ts) AS m, COUNT(*) AS searches\n  FROM search_events WHERE event_type = 'search' GROUP BY 1, 2\n),\nn AS (\n  SELECT l.market, strftime('%Y-%m', b.check_in) AS m, SUM(b.nights) AS booked_nights\n  FROM bookings b JOIN listings l ON l.listing_id = b.listing_id\n  WHERE b.status <> 'cancelled' GROUP BY 1, 2\n)\nSELECT s.market, s.m, s.searches, n.booked_nights,\n       ROUND(1.0 * s.searches / n.booked_nights, 3) AS searches_per_booked_night\nFROM s JOIN n ON n.market = s.market AND n.m = s.m"},{"id":"S48","title":"Cancellation rate by lead-time bucket","origin":"PRACTICE","source":"Combines the lead-time and cancellation-rate patterns both named for the SQL round.","category":"Marketplace Metrics","difficulty":"Medium","tags":["Bucketing","Rates"],"prompt":"Bucket bookings by lead time (check_in minus date of booked_at): 0-6 = 'last_minute', 7-29 = 'near', 30-59 = 'planned', 60+ = 'far_out'.\n\nReturn the cancellation rate per bucket across all bookings.\n\nColumns: lead_bucket, bookings, cancellations, cancellation_rate (ROUND 4)","starter":"SELECT ...","solution":"WITH b AS (\n  SELECT status,\n         CAST(julianday(check_in) - julianday(date(booked_at)) AS INTEGER) AS lead_days\n  FROM bookings\n)\nSELECT CASE WHEN lead_days < 7 THEN 'last_minute'\n            WHEN lead_days < 30 THEN 'near'\n            WHEN lead_days < 60 THEN 'planned'\n            ELSE 'far_out' END AS lead_bucket,\n       COUNT(*) AS bookings,\n       SUM(CASE WHEN status = 'cancelled' THEN 1 ELSE 0 END) AS cancellations,\n       ROUND(1.0 * SUM(CASE WHEN status = 'cancelled' THEN 1 ELSE 0 END) / COUNT(*), 4) AS cancellation_rate\nFROM b GROUP BY 1"},{"id":"S49","title":"Half-over-half market comparison","origin":"PRACTICE","source":"Period-over-period comparison in one pass; a common ask after month-over-month.","category":"Marketplace Metrics","difficulty":"Medium","tags":["Conditional Aggregation","Period Compare"],"prompt":"Compare H1 2025 (check_in Jan-Jun) against H2 2025 (Jul-Dec) for each market, using non-cancelled bookings, in a single pass with conditional aggregation - no self join.\n\nColumns: market, h1_bookings, h2_bookings, h1_revenue (ROUND 2), h2_revenue (ROUND 2), revenue_growth_pct (ROUND 2)","starter":"SELECT ...","solution":"SELECT l.market,\n       SUM(CASE WHEN CAST(strftime('%m', b.check_in) AS INTEGER) <= 6 THEN 1 ELSE 0 END) AS h1_bookings,\n       SUM(CASE WHEN CAST(strftime('%m', b.check_in) AS INTEGER) > 6 THEN 1 ELSE 0 END) AS h2_bookings,\n       ROUND(SUM(CASE WHEN CAST(strftime('%m', b.check_in) AS INTEGER) <= 6 THEN b.total_amount ELSE 0 END), 2) AS h1_revenue,\n       ROUND(SUM(CASE WHEN CAST(strftime('%m', b.check_in) AS INTEGER) > 6 THEN b.total_amount ELSE 0 END), 2) AS h2_revenue,\n       ROUND((SUM(CASE WHEN CAST(strftime('%m', b.check_in) AS INTEGER) > 6 THEN b.total_amount ELSE 0 END)\n            - SUM(CASE WHEN CAST(strftime('%m', b.check_in) AS INTEGER) <= 6 THEN b.total_amount ELSE 0 END)) * 100.0\n            / SUM(CASE WHEN CAST(strftime('%m', b.check_in) A
