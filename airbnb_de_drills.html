:"SCD2 on dim_listing is the modeling pattern Airbnb's data modeling round centres on; this is its code form.","category":"ETL Transform","difficulty":"Hard","tags":["SCD2","Change Detection","Effective Dating"],"fn":"build_scd2","prompt":"<code>snapshots<\/code> is a list of {\"listing_id\",\"snapshot_date\",\"attrs\":{...}} - one row per listing per day, already complete.\n\nCollapse consecutive days with identical attrs into one version. Emit for each version:\n<code>{\"listing_id\",\"attrs\",\"valid_from\",\"valid_to\",\"is_current\"}<\/code>\n\nvalid_to is the snapshot_date of the day the next version starts; the final version has valid_to = None and is_current = True. Sort by listing_id then valid_from.","signature":"def build_scd2(snapshots):\n    pass","solution":"def build_scd2(snapshots):\n    by_listing = {}\n    for s in snapshots:\n        by_listing.setdefault(s['listing_id'], []).append(s)\n    out = []\n    for lid in sorted(by_listing):\n        rows = sorted(by_listing[lid], key=lambda s: s['snapshot_date'])\n        versions = []\n        for s in rows:\n            key = sorted((s.get('attrs') or {}).items())\n            if versions and versions[-1][0] == key:\n                continue\n            versions.append((key, s['snapshot_date'], s.get('attrs') or {}))\n        for i, (_, start, attrs) in enumerate(versions):\n            nxt = versions[i+1][1] if i + 1 < len(versions) else None\n            out.append({'listing_id': lid, 'attrs': attrs, 'valid_from': start,\n                        'valid_to': nxt, 'is_current': nxt is None})\n    return out","tests":[{"args":[[{"listing_id":1,"snapshot_date":"2025-06-01","attrs":{"price":100}},{"listing_id":1,"snapshot_date":"2025-06-02","attrs":{"price":100}},{"listing_id":1,"snapshot_date":"2025-06-03","attrs":{"price":120}}]],"expected":[{"listing_id":1,"attrs":{"price":100},"valid_from":"2025-06-01","valid_to":"2025-06-03","is_current":false},{"listing_id":1,"attrs":{"price":120},"valid_from":"2025-06-03","valid_to":null,"is_current":true}],"hidden":false},{"args":[[{"listing_id":2,"snapshot_date":"2025-06-01","attrs":{"a":1}}]],"expected":[{"listing_id":2,"attrs":{"a":1},"valid_from":"2025-06-01","valid_to":null,"is_current":true}],"hidden":false},{"args":[[]],"expected":[],"hidden":true}]},{"id":"P40","title":"Restate daily metrics after late corrections","origin":"PRACTICE","source":"Backfill / restatement logic, a recurring Airbnb pipeline theme.","category":"ETL Transform","difficulty":"Hard","tags":["Restatement","Corrections","Backfill"],"fn":"restate_daily","prompt":"<code>facts<\/code> are {\"booking_id\",\"stay_date\",\"amount\"} rows already published. <code>corrections<\/code> are later rows for the same booking_id: an amount replaces the published one, and an amount of None means the booking was voided and must disappear.\n\nA correction may also move a booking to a different stay_date, in which case both the old and new day change.\n\nReturn the restated daily totals as [[stay_date, amount], ...] sorted by stay_date, amounts rounded to 2 decimals, dropping days whose total is exactly 0.","signature":"def restate_daily(facts, corrections):\n    pass","solution":"def restate_daily(facts, corrections):\n    state = {}\n    for f in facts:\n        state[f['booking_id']] = (f['stay_date'], f['amount'])\n    for c in corrections:\n        if c.get('amount') is None:\n            state.pop(c['booking_id'], None)\n        else:\n            state[c['booking_id']] = (c['stay_date'], c['amount'])\n    totals = {}\n    for stay_date, amount in state.values():\n        totals[stay_date] = totals.get(stay_date, 0) + amount\n    return [[d, round(v, 2)] for d, v in sorted(totals.items()) if round(v, 2) != 0]","tests":[{"args":[[{"booking_id":"b1","stay_date":"2025-06-01","amount":100.0}],[{"booking_id":"b1","stay_date":"2025-06-01","amount":150.0}]],"expected":[["2025-06-01",150.0]],"hidden":false},{"args":[[{"booking_id":"b1","stay_date":"2025-06-01","amount":100.0}],[{"booking_id":"b1","stay_date":null,"amount":null}]],"expected":[],"hidden":false},{"args":[[{"booking_id":"b1","stay_date":"2025-06-01","amount":100.0},{"booking_id":"b2","stay_date":"2025-06-02","amount":50.0}],[{"booking_id":"b1","stay_date":"2025-06-02","amount":100.0}]],"expected":[["2025-06-02",150.0]],"hidden":true}]},{"id":"P41","title":"Detect overlapping bookings on a listing","origin":"PRACTICE","source":"Interval logic on stays; the double-booking check every marketplace pipeline needs.","category":"Event Streams","difficulty":"Medium","tags":["Intervals","Sorting","Sweep"],"fn":"find_overlaps","prompt":"Bookings are (listing_id, booking_id, check_in, check_out) with check_out exclusive - a stay ending on the 4th does not clash with one starting on the 4th.\n\nReturn every overlapping pair as [listing_id, booking_a, booking_b] where booking_a is the one that starts earlier (tie: lower booking_id). Sort the output by listing_id, then booking_a, then booking_b.","signature":"def find_overlaps(bookings):\n    pass","solution":"def find_overlaps(bookings):\n    by_listing = {}\n    for lid, bid, ci, co in bookings:\n        by_listing.setdefault(lid, []).append((ci, co, bid))\n    out = []\n    for lid in sorted(by_listing):\n        rows = sorted(by_listing[lid], key=lambda r: (r[0], r[2]))\n        for i in range(len(rows)):\n            for j in range(i + 1, len(rows)):\n                if rows[j][0] < rows[i][1]:\n                    out.append([lid, rows[i][2], rows[j][2]])\n                else:\n                    break\n    return sorted(out)","tests":[{"args":[[[1,"a","2025-06-01","2025-06-05"],[1,"b","2025-06-04","2025-06-08"]]],"expected":[[1,"a","b"]],"hidden":false},{"args":[[[1,"a","2025-06-01","2025-06-04"],[1,"b","2025-06-04","2025-06-08"]]],"expected":[],"hidden":false},{"args":[[[2,"x","2025-06-01","2025-06-10"],[2,"y","2025-06-02","2025-06-03"],[2,"z","2025-06-05","2025-06-06"]]],"expected":[[2,"x","y"],[2,"x","z"]],"hidden":true}]},{"id":"P42","title":"Expand bookings to night grain","origin":"PRACTICE","source":"Night-grain expansion is the trap Airbnb's SQL round is built around; this is the Python version.","category":"ETL Transform","difficulty":"Medium","tags":["Date Expansion","Grain"],"fn":"expand_nights","prompt":"Given (listing_id, check_in, check_out) with check_out exclusive, emit one row per night stayed.\n\nReturn [[listing_id, night], ...] sorted by listing_id then night. Zero- or negative-length stays produce nothing. Duplicate nights (from overlapping stays) are kept.","signature":"from datetime import date, timedelta\n\ndef expand_nights(bookings):\n    pass","solution":"from datetime import date, timedelta\n\ndef expand_nights(bookings):\n    out = []\n    for lid, ci, co in bookings:\n        d = date.fromisoformat(ci)\n        end = date.fromisoformat(co)\n        while d < end:\n            out.append([lid, d.isoformat()])\n            d += timedelta(days=1)\n    return sorted(out)","tests":[{"args":[[[1,"2025-06-01","2025-06-04"]]],"expected":[[1,"2025-06-01"],[1,"2025-06-02"],[1,"2025-06-03"]],"hidden":false},{"args":[[[1,"2025-06-01","2025-06-01"]]],"expected":[],"hidden":false},{"args":[[[2,"2025-06-02","2025-06-03"],[2,"2025-06-02","2025-06-03"]]],"expected":[[2,"2025-06-02"],[2,"2025-06-02"]],"hidden":true}]},{"id":"P43","title":"Fill rate per listing","origin":"PRACTICE","source":"Fill rate is the metric the Airbnb guides put at the centre of the supply side.","category":"Metrics","difficulty":"Medium","tags":["Fill Rate","Denominator"],"fn":"fill_rates","prompt":"<code>calendar<\/code> rows are (listing_id, night, is_available, is_booked) as 0/1 ints.\n\nFill rate = booked nights / available nights, where a night only counts in the denominator when is_available is 1. A booked night is always counted as available even if the flag says otherwise (a stay implies availability) - handle that.\n\nReturn [[listing_id, available, booked, fill_rate], ...] sorted by listing_id, rate rounded to 4 decimals. Listings with zero available nights are excluded.","signature":"def fill_rates(calendar):\n    pass","solution":"def fill_rates(calendar):\n    acc = {}\n    for lid, night, avail, booked in calendar:\n        a = acc.setdefault(lid, [0, 0])\n        if avail == 1 or booked == 1:\n            a[0] += 1\n            if booked == 1:\n                a[1] += 1\n    out = []\n    for lid in sorted(acc):\n        avail, booked = acc[lid]\n        if avail == 0:\n            continue\n        out.append([lid, avail, booked, round(booked / avail, 4)])\n    return out","tests":[{"args":[[[1,"2025-06-01",1,1],[1,"2025-06-02",1,0],[1,"2025-06-03",0,0]]],"expected":[[1,2,1,0.5]],"hidden":false},{"args":[[[2,"2025-06-01",0,1]]],"expected":[[2,1,1,1.0]],"hidden":false},{"args":[[[3,"2025-06-01",0,0]]],"expected":[],"hidden":true}]},{"id":"P44","title":"Convert to USD with as-of FX rates","origin":"PRACTICE","source":"Multi-currency payments are explicitly part of Airbnb's payments-data domain.","category":"ETL Transform","difficulty":"Hard","tags":["As-Of Join","FX","Bisect"],"fn":"to_usd","prompt":"<code>payments<\/code> are {\"payment_id\",\"currency\",\"amount\",\"date\"}. <code>rates<\/code> are {\"currency\": [[date, rate_to_usd], ...]} sorted ascending by date.\n\nFor each payment use the most recent rate with date <= the payment date. USD is always 1.0 and may be absent from rates. If no rate on or before that date exists, the payment converts to None.\n\nReturn [[payment_id, usd_amount], ...] sorted by payment_id, amounts rounded to 2 decimals.","signature":"import bisect\n\ndef to_usd(payments, rates):\n    pass","solution":"import bisect\n\ndef to_usd(payments, rates):\n    prepared = {}\n    for cur, series in rates.items():\n        prepared[cur] = ([d for d, _ in series], [r for _, r in series])\n    out = []\n    for p in payments:\n        cur = p['currency']\n        if cur == 'USD':\n            out.append([p['payment_id'], round(p['amount'], 2)])\n            continue\n        if cur not in prepared:\n            out.append([p['payment_id'], None])\n            continue\n        dates, vals = prepared[cur]\n        i = bisect.bisect_right(dates, p['date']) - 1\n        if i < 0:\n            out.append([p['payment_id'], None])\n        else:\n            out.append([p['payment_id'], round(p['amount'] * vals[i], 2)])\n    return sorted(out, key=lambda r: r[0])","tests":[{"args":[[{"payment_id":"p1","currency":"EUR","amount":100.0,"date":"2025-06-05"}],{"EUR":[["2025-06-01",1.1],["2025-06-04",1.2]]}],"expected":[["p1",120.0]],"hidden":false},{"args":[[{"payment_id":"p2","currency":"USD","amount":50.0,"date":"2025-06-05"}],{}],"expected":[["p2",50.0]],"hidden":false},{"args":[[{"payment_id":"p3","currency":"JPY","amount":1000.0,"date":"2025-01-01"}],{"JPY":[["2025-06-01",0.0065]]}],"expected":[["p3",null]],"hidden":true}]},{"id":"P45","title":"Reconcile payments against bookings","origin":"PRACTICE","source":"Reconciliation between two systems, the shape of the reported 'Payment Data Pipeline' question.","category":"Data Quality","difficulty":"Medium","tags":["Reconciliation","Tolerance","Anti-Join"],"fn":"reconcile","prompt":"<code>bookings<\/code>: {\"booking_id\",\"amount\"}. <code>payments<\/code>: {\"booking_id\",\"amount\",\"status\"}.\n\nNet paid = sum of 'captured' minus sum of 'refunded'; other statuses are ignored.\n\nClassify each booking:\n- 'matched' - abs(net_paid - booking amount) <= 0.01\n- 'underpaid' / 'overpaid' - outside that tolerance\n- 'unpaid' - no payment rows at all\n\nAlso report payments whose booking_id has no booking, as 'orphan_payments'.\n\nReturn {\"matched\": [...], \"underpaid\": [...], \"overpaid\": [...], \"unpaid\": [...], \"orphan_payments\": [...]} with sorted booking_id lists.","signature":"def reconcile(bookings, payments):\n    pass","solution":"def reconcile(bookings, payments):\n    net = {}\n    seen = set()\n    for p in payments:\n        bid = p['booking_id']\n        seen.add(bid)\n        if p['status'] == 'captured':\n            net[bid] = net.get(bid, 0) + p['amount']\n        elif p['status'] == 'refunded':\n            net[bid] = net.get(bid, 0) - p['amount']\n        else:\n            net.setdefault(bid, 0)\n    res = {'matched': [], 'underpaid': [], 'overpaid': [], 'unpaid': [], 'orphan_payments': []}\n    known = set()\n    for b in bookings:\n        bid = b['booking_id']\n        known.add(bid)\n        if bid not in seen:\n            res['unpaid'].append(bid)\n            continue\n        diff = net.get(bid, 0) - b['amount']\n        if abs(diff) <= 0.01:\n            res['matched'].append(bid)\n        elif diff < 0:\n            res['underpaid'].append(bid)\n        else:\n            res['overpaid'].append(bid)\n    res['orphan_payments'] = sorted(seen - known)\n    for k in ('matched', 'underpaid', 'overpaid', 'unpaid'):\n        res[k] = sorted(res[k])\n    return res","tests":[{"args":[[{"booking_id":"b1","amount":100.0}],[{"booking_id":"b1","amount":100.0,"status":"captured"}]],"expected":{"matched":["b1"],"underpaid":[],"overpaid":[],"unpaid":[],"orphan_payments":[]},"hidden":false},{"args":[[{"booking_id":"b1","amount":100.0},{"booking_id":"b2","amount":50.0}],[{"booking_id":"b1","amount":100.0,"status":"captured"},{"booking_id":"b1","amount":100.0,"status":"refunded"},{"booking_id":"b9","amount":10.0,"status":"captured"}]],"expected":{"matched":[],"underpaid":["b1"],"overpaid":[],"unpaid":["b2"],"orphan_payments":["b9"]},"hidden":false},{"args":[[],[]],"expected":{"matched":[],"underpaid":[],"overpaid":[],"unpaid":[],"orphan_payments":[]},"hidden":true}]},{"id":"P46","title":"Streaming top-k with a bounded heap","origin":"PRACTICE","source":"The 'now it doesn't fit in memory' follow-up to any top-N question.","category":"Arrays","difficulty":"Medium","tags":["Heap","Streaming","Memory Bound"],"fn":"stream_top_k","prompt":"Given an iterable of (key, value) pairs, return the k pairs with the largest values, using a min-heap of size at most k rather than sorting everything.\n\nTies on value are broken by key ascending. Return [[key, value], ...] sorted by value descending then key ascending.","signature":"import heapq\n\ndef stream_top_k(pairs, k):\n    pass","solution":"import heapq\n\ndef stream_top_k(pairs, k):\n    if k <= 0:\n        return []\n    h = []\n    for key, val in pairs:\n        item = (val, [-ord(c) for c in str(key)])\n        if len(h) < k:\n            heapq.heappush(h, (val, key))\n        else:\n            if (val, key) > h[0]:\n                heapq.heapreplace(h, (val, key))\n    return [[key, val] for val, key in sorted(h, key=lambda t: (-t[0], t[1]))]","tests":[{"args":[[["a",5],["b",9],["c",1],["d",7]],2],"expected":[["b",9],["d",7]],"hidden":false},{"args":[[["a",1],["b",1]],5],"expected":[["a",1],["b",1]],"hidden":false},{"args":[[["a",1]],0],"expected":[],"hidden":true}]},{"id":"P47","title":"Chunk a stream into batches","origin":"PRACTICE","source":"Batching before a downstream write; standard in the coding round when scale comes up.","category":"ETL Transform","difficulty":"Easy","tags":["Generators","Batching"],"fn":"chunk","prompt":"Split an iterable into consecutive lists of at most <code>size<\/code> items. The final batch may be short.\n\nReturn a list of lists. A size of 0 or less returns []. An empty input returns [].","signature":"def chunk(items, size):\n    pass","solution":"def chunk(items, size):\n    if size <= 0:\n        return []\n    out = []\n    cur = []\n    for it in items:\n        cur.append(it)\n        if len(cur) == size:\n            out.append(cur)\n            cur = []\n    if cur:\n        out.append(cur)\n    return out","tests":[{"args":[[1,2,3,4,5],2],"expected":[[1,2],[3,4],[5]],"hidden":false},{"args":[[],3],"expected":[],"hidden":false},{"args":[[1,2],0],"expected":[],"hidden":true},{"args":[[1,2,3],10],"expected":[[1,2,3]],"hidden":true}]},{"id":"P48","title":"Retry schedule with exponential backoff","origin":"PRACTICE","source":"Airflow retry semantics; Airbnb expects fluency here given they authored Airflow.","category":"Idempotency","difficulty":"Easy","tags":["Backoff","Caps","Pure Functions"],"fn":"backoff_schedule","prompt":"Return the wait times in seconds before each retry: base * 2**(attempt-1), capped at max_delay, for attempts 1..max_retries.\n\nmax_retries of 0 or less returns []. All values are ints.","signature":"def backoff_schedule(base, max_delay, max_retries):\n    pass","solution":"def backoff_schedule(base, max_delay, max_retries):\n    out = []\n    for attempt in range(1, max_retries + 1):\n        out.append(min(base * (2 ** (attempt - 1)), max_delay))\n    return out","tests":[{"args":[5,300,6],"expected":[5,10,20,40,80,160],"hidden":false},{"args":[60,100,4],"expected":[60,100,100,100],"hidden":false},{"args":[5,300,0],"expected":[],"hidden":true}]},{"id":"P49","title":"Parse Hive-style partition paths","origin":"PRACTICE","source":"Airbnb's warehouse is Hive on S3; partition-path handling is everyday work there.","category":"ETL Transform","difficulty":"Medium","tags":["Path Parsing","Partitions"],"fn":"parse_partitions","prompt":"Given S3-style paths such as\n\n<code>s3://warehouse/fact_booking/ds=2025-06-01/market=Paris/part-000.parquet<\/code>\n\nextract the partition keys into a dict per path: {\"ds\": \"2025-06-01\", \"market\": \"Paris\"}.\n\nOnly segments of the form key=value count. Paths with no partition segments yield an empty dict. Return one dict per input path, in order.","signature":"def parse_partitions(paths):\n    pass","solution":"def parse_partitions(paths):\n    out = []\n    for p in paths:\n        d = {}\n        for seg in str(p).split('/'):\n            if '=' in seg:\n                k, v = seg.split('=', 1)\n                if k and v:\n                    d[k] = v\n        out.append(d)\n    return out","tests":[{"args":[["s3://w/fact_booking/ds=2025-06-01/market=Paris/part-000.parquet"]],"expected":[{"ds":"2025-06-01","market":"Paris"}],"hidden":false},{"args":[["s3://w/table/part-000.parquet"]],"expected":[{}],"hidden":false},{"args":[["ds=2025-06-01/ds=2025-06-02/f"]],"expected":[{"ds":"2025-06-02"}],"hidden":true}]},{"id":"P50","title":"Union records across a schema change","origin":"PRACTICE","source":"Schema evolution is named as a system-design deep dive Airbnb probes; this is the record-level version.","category":"ETL Transform","difficulty":"Medium","tags":["Schema Evolution","Column Union","Defaults"],"fn":"union_schemas","prompt":"Records arrive from two producer versions with different key sets.\n\nProduce the union schema: every key seen anywhere, sorted alphabetically. Fill missing keys with None. Return {\"columns\": [...], \"rows\": [[...], ...]} where each row's values follow the column order, rows in input order.","signature":"def union_schemas(records):\n    pass","solution":"def union_schemas(records):\n    cols = set()\n    for r in records:\n        cols |= set(r.keys())\n    columns = sorted(cols)\n    rows = [[r.get(c) for c in columns] for r in records]\n    return {'columns': columns, 'rows': rows}","tests":[{"args":[[{"a":1,"b":2},{"b":3,"c":4}]],"expected":{"columns":["a","b","c"],"rows":[[1,2,null],[null,3,4]]},"hidden":false},{"args":[[]],"expected":{"columns":[],"rows":[]},"hidden":false},{"args":[[{"z":1},{"a":2}]],"expected":{"columns":["a","z"],"rows":[[null,1],[2,null]]},"hidden":true}]},{"id":"P51","title":"Rolling 7-day metric with gap filling","origin":"PRACTICE","source":"The Python twin of the moving-average SQL question; missing days are the trap.","category":"Metrics","difficulty":"Hard","tags":["Rolling Window","Gap Filling","Dates"],"fn":"rolling_7d","prompt":"<code>series<\/code> is [[date, value], ...], possibly with missing days and not necessarily sorted.\n\nFill every calendar day between the first and last date with 0, then return the trailing 7-day sum for each day (that day plus the six before it, treating days before the series start as 0).\n\nReturn [[date, rolling_sum], ...] sorted by date. Empty input returns [].","signature":"from datetime import date, timedelta\n\ndef rolling_7d(series):\n    pass","solution":"from datetime import date, timedelta\n\ndef rolling_7d(series):\n    if not series:\n        return []\n    vals = {}\n    for d, v in series:\n        vals[d] = vals.get(d, 0) + v\n    start = date.fromisoformat(min(vals))\n    end = date.fromisoformat(max(vals))\n    days = []\n    d = start\n    while d <= end:\n        days.append((d.isoformat(), vals.get(d.isoformat(), 0)))\n        d += timedelta(days=1)\n    out = []\n    for i in range(len(days)):\n        lo = max(0, i - 6)\n        out.append([days[i][0], sum(v for _, v in days[lo:i+1])])\n    return out","tests":[{"args":[[["2025-06-01",1],["2025-06-03",2]]],"expected":[["2025-06-01",1],["2025-06-02",1],["2025-06-03",3]],"hidden":false},{"args":[[]],"expected":[],"hidden":false},{"args":[[["2025-06-08",1],["2025-06-01",1]]],"expected":[["2025-06-01",1],["2025-06-02",1],["2025-06-03",1],["2025-06-04",1],["2025-06-05",1],["2025-06-06",1],["2025-06-07",1],["2025-06-08",1]],"hidden":true}]},{"id":"P52","title":"Cohort retention matrix","origin":"PRACTICE","source":"The Python form of the cohort question Airbnb's SQL round asks.","category":"Metrics","difficulty":"Hard","tags":["Cohorts","Month Arithmetic","Matrix"],"fn":"retention_matrix","prompt":"<code>signups<\/code> are (guest_id, signup_month) and <code>activity<\/code> are (guest_id, activity_month), both as 'YYYY-MM'.\n\nBuild a retention matrix: for each signup cohort and each offset 0..max_offset, the count of distinct guests active in that offset month.\n\noffset = 12*(activity_year - signup_year) + (activity_month - signup_month). Negative offsets are dropped.\n\nReturn [[cohort_month, offset, cohort_size, active], ...] for every cohort and every offset 0..max_offset, including zeros, sorted by cohort_month then offset.","signature":"def retention_matrix(signups, activity, max_offset):\n    pass","solution":"def retention_matrix(signups, activity, max_offset):\n    def to_i(m):\n        y, mo = m.split('-')\n        return int(y) * 12 + int(mo)\n\n    cohort_of = {}\n    sizes = {}\n    for g, m in signups:\n        cohort_of[g] = m\n        sizes[m] = sizes.get(m, 0) + 1\n    cells = {}\n    for g, m in activity:\n        c = cohort_of.get(g)\n        if c is None:\n            continue\n        off = to_i(m) - to_i(c)\n        if 0 <= off <= max_offset:\n            cells.setdefault((c, off), set()).add(g)\n    out = []\n    for c in sorted(sizes):\n        for off in range(max_offset + 1):\n            out.append([c, off, sizes[c], len(cells.get((c, off), set()))])\n    return out","tests":[{"args":[[["g1","2025-01"],["g2","2025-01"]],[["g1","2025-01"],["g1","2025-02"],["g2","2025-01"]],2],"expected":[["2025-01",0,2,2],["2025-01",1,2,1],["2025-01",2,2,0]],"hidden":false},{"args":[[["g1","2025-01"]],[["g9","2025-01"]],1],"expected":[["2025-01",0,1,0],["2025-01",1,1,0]],"hidden":false},{"args":[[["g1","2025-12"]],[["g1","2026-01"]],1],"expected":[["2025-12",0,1,0],["2025-12",1,1,1]],"hidden":true}]},{"id":"P53","title":"Collapse near-duplicate bookings","origin":"PRACTICE","source":"The Python twin of the SQL dedup question; double-taps and at-least-once producers both create these.","category":"Data Quality","difficulty":"Medium","tags":["Fuzzy Key","Dedup","Time Tolerance"],"fn":"collapse_duplicates","prompt":"Two bookings are the same reservation when they share guest_id, listing_id and check_in, and their booked_at values are within <code>window_s<\/code> seconds of each other.\n\nProcess bookings in booked_at order (tie: booking_id). Keep the first of each group and count how many collapsed into it.\n\nReturn [[kept_booking_id, collapsed_count], ...] sorted by kept_booking_id, where collapsed_count includes the kept row.","signature":"from datetime import datetime\n\ndef collapse_duplicates(bookings, window_s):\n    pass","solution":"from datetime import datetime\n\ndef collapse_duplicates(bookings, window_s):\n    def p(ts):\n        return datetime.strptime(ts, '%Y-%m-%d %H:%M:%S')\n\n    rows = sorted(bookings, key=lambda b: (b['booked_at'], b['booking_id']))\n    kept = {}\n    order = []\n    for b in rows:\n        key = (b['guest_id'], b['listing_id'], b['check_in'])\n        hit = None\n        for k in order:\n            if k[0] == key and abs((p(b['booked_at']) - p(kept[k]['ts'])).total_seconds()) <= window_s:\n                hit = k\n                break\n        if hit is None:\n            k = (key, b['booking_id'])\n            kept[k] = {'ts': b['booked_at'], 'count': 1}\n            order.append(k)\n        else:\n            kept[hit]['count'] += 1\n    return sorted([[k[1], v['count']] for k, v in kept.items()])","tests":[{"args":[[{"booking_id":"b1","guest_id":1,"listing_id":9,"check_in":"2025-07-01","booked_at":"2025-06-01 10:00:00"},{"booking_id":"b2","guest_id":1,"listing_id":9,"check_in":"2025-07-01","booked_at":"2025-06-01 10:00:20"}],60],"expected":[["b1",2]],"hidden":false},{"args":[[{"booking_id":"b1","guest_id":1,"listing_id":9,"check_in":"2025-07-01","booked_at":"2025-06-01 10:00:00"},{"booking_id":"b2","guest_id":1,"listing_id":9,"check_in":"2025-07-01","booked_at":"2025-06-01 12:00:00"}],60],"expected":[["b1",1],["b2",1]],"hidden":false},{"args":[[],60],"expected":[],"hidden":true}]},{"id":"P54","title":"Flatten nested search filters","origin":"PRACTICE","source":"Reshaping nested payloads into rectangular form, quoted as core Airbnb Python-round work.","category":"ETL Transform","difficulty":"Medium","tags":["Recursion","Flattening","Dotted Keys"],"fn":"flatten","prompt":"Flatten an arbitrarily nested dict into a single level using dotted keys:\n\n<code>{\"geo\": {\"market\": \"Paris\"}, \"price\": {\"min\": 50, \"max\": 200}}<\/code>\nbecomes\n<code>{\"geo.market\": \"Paris\", \"price.min\": 50, \"price.max\": 200}<\/code>\n\nLists are left as values, not expanded. Empty dicts vanish. Return keys in sorted order (a plain dict is fine - it will be compared by content).","signature":"def flatten(d):\n    pass","solution":"def flatten(d):\n    out = {}\n\n    def walk(node, prefix):\n        for k, v in node.items():\n            key = prefix + k if not prefix else prefix + k\n            if isinstance(v, dict):\n                walk(v, key + '.')\n            else:\n                out[key] = v\n\n    walk(d, '')\n    return {k: out[k] for k in sorted(out)}","tests":[{"args":[{"geo":{"market":"Paris"},"price":{"min":50,"max":200}}],"expected":{"geo.market":"Paris","price.max":200,"price.min":50},"hidden":false},{"args":[{"a":{"b":{"c":1}},"d":[1,2]}],"expected":{"a.b.c":1,"d":[1,2]},"hidden":false},{"args":[{"empty":{}}],"expected":{},"hidden":true},{"args":[{}],"expected":{},"hidden":true}]},{"id":"P55","title":"Host response rate from inquiry logs","origin":"PRACTICE","source":"Host response rate is one of the named marketplace metrics; here it is computed in code from raw events.","category":"Metrics","difficulty":"Medium","tags":["Pairing Events","SLA","Rates"],"fn":"response_rate","prompt":"<code>events<\/code> are {\"host_id\",\"inquiry_id\",\"kind\",\"ts\"} where kind is 'inquiry' or 'response'. A response with no matching inquiry is ignored; an inquiry may have several responses (take the earliest).\n\nAn inquiry is answered in time when the earliest response is within <code>sla_hours<\/code> of the inquiry. Unanswered inquiries count against the host.\n\nReturn [[host_id, inquiries, on_time, rate], ...] sorted by host_id, rate rounded to 4 decimals.","signature":"from datetime import datetime\n\ndef response_rate(events, sla_hours):\n    pass","solution":"from datetime import datetime\n\ndef response_rate(events, sla_hours):\n    def p(ts):\n        return datetime.strptime(ts, '%Y-%m-%d %H:%M:%S')\n\n    inq = {}\n    resp = {}\n    for e in events:\n        if e['kind'] == 'inquiry':\n            inq[e['inquiry_id']] = (e['host_id'], e['ts'])\n        elif e['kind'] == 'response':\n            key = e['inquiry_id']\n            if key not in resp or e['ts'] < resp[key]:\n                resp[key] = e['ts']\n    acc = {}\n    for iid, (host, ts) in inq.items():\n        a = acc.setdefault(host, [0, 0])\n        a[0] += 1\n        r = resp.get(iid)\n        if r is not None and (p(r) - p(ts)).total_seconds() <= sla_hours * 3600:\n            a[1] += 1\n    out = []\n    for host in sorted(acc):\n        total, ok = acc[host]\n        out.append([host, total, ok, round(ok / total, 4)])\n    return out","tests":[{"args":[[{"host_id":1,"inquiry_id":"i1","kind":"inquiry","ts":"2025-06-01 10:00:00"},{"host_id":1,"inquiry_id":"i1","kind":"response","ts":"2025-06-01 20:00:00"},{"host_id":1,"inquiry_id":"i2","kind":"inquiry","ts":"2025-06-02 10:00:00"}],24],"expected":[[1,2,1,0.5]],"hidden":false},{"args":[[{"host_id":2,"inquiry_id":"i9","kind":"response","ts":"2025-06-01 10:00:00"}],24],"expected":[],"hidden":false},{"args":[[{"host_id":3,"inquiry_id":"i1","kind":"inquiry","ts":"2025-06-01 10:00:00"},{"host_id":3,"inquiry_id":"i1","kind":"response","ts":"2025-06-05 10:00:00"},{"host_id":3,"inquiry_id":"i1","kind":"response","ts":"2025-06-01 11:00:00"}],24],"expected":[[3,1,1,1.0]],"hidden":true}]},{"id":"P56","title":"Tumbling window aggregation","origin":"PRACTICE","source":"Windowed aggregation over an event stream; the streaming counterpart to the daily rollup.","category":"Event Streams","difficulty":"Hard","tags":["Tumbling Windows","Streaming","Bucketing"],"fn":"tumbling_windows","prompt":"Aggregate events into fixed non-overlapping windows of <code>window_s<\/code> seconds, anchored at the epoch (window start = floor(epoch_seconds / window_s) * window_s).\n\nEvents are {\"ts\": \"YYYY-MM-DD HH:MM:SS\", \"value\": number}. Return [[window_start_iso, count, total], ...] sorted by window start, where window_start_iso is formatted the same way. Totals rounded to 2 decimals.\n\nWindows with no events are omitted.","signature":"from datetime import datetime, timezone\n\ndef tumbling_windows(events, window_s):\n    pass","solution":"from datetime import datetime, timezone\n\ndef tumbling_windows(events, window_s):\n    acc = {}\n    for e in events:\n        dt = datetime.strptime(e['ts'], '%Y-%m-%d %H:%M:%S').replace(tzinfo=timezone.utc)\n        epoch = int(dt.timestamp())\n        start = (epoch // window_s) * window_s\n        a = acc.setdefault(start, [0, 0.0])\n        a[0] += 1\n        a[1] += e.get('value', 0)\n    out = []\n    for start in sorted(acc):\n        label = datetime.fromtimestamp(start, tz=timezone.utc).strftime('%Y-%m-%d %H:%M:%S')\n        out.append([label, acc[start][0], round(acc[start][1], 2)])\n    return out","tests":[{"args":[[{"ts":"2025-06-01 10:00:10","value":1},{"ts":"2025-06-01 10:00:50","value":2},{"ts":"2025-06-01 10:01:05","value":3}],60],"expected":[["2025-06-01 10:00:00",2,3.0],["2025-06-01 10:01:00",1,3.0]],"hidden":false},{"args":[[],60],"expected":[],"hidden":false},{"args":[[{"ts":"2025-06-01 10:04:59","value":1.005}],300],"expected":[["2025-06-01 10:00:00",1,1.0]],"hidden":true}]}]}</script>
<script>
"use strict";

const BANK = JSON.parse(document.getElementById('bank').textContent);
const TRACKS = { sql: BANK.sql, python: BANK.python };

let track = 'sql';
let items = [];          // filtered view of the active track
let current = null;      // active problem
const state = {};        // key -> {status, code}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const key = p => track + ':' + p.id;

/* ---------------------------------------------------------------- editor */
let cm = null;
function initEditor() {
  if (typeof CodeMirror === 'undefined') return;
  cm = CodeMirror.fromTextArea($('code'), {
    lineNumbers: true,
    mode: 'text/x-sql',
    autoCloseBrackets: true,
    indentUnit: 2,
    matchBrackets: true,
    extraKeys: {
      'Ctrl-Enter': run, 'Cmd-Enter': run,
      'Ctrl-/': cmv => cmv.toggleComment(), 'Cmd-/': cmv => cmv.toggleComment(),
      Tab: cmv => cmv.somethingSelected() ? cmv.indentSelection('add')
                                          : cmv.replaceSelection('    ', 'end'),
      'Shift-Tab': cmv => cmv.indentSelection('subtract')
    }
  });
}
function setCode(text) {
  if (cm) { cm.setValue(text); cm.clearHistory(); }
  else $('code').value = text;
}
function getCode() { return cm ? cm.getValue() : $('code').value; }
function setMode(m) {
  if (cm) cm.setOption('mode', m === 'sql' ? 'text/x-sql' : 'python');
}

/* ---------------------------------------------------------------- sidebar */
function statusOf(p) { const s = state[key(p)]; return s ? s.status : 'notstarted'; }

function applyFilters() {
  const all = TRACKS[track];
  const q = $('f-search').value.trim().toLowerCase();
  const og = $('f-origin').value, cat = $('f-category').value;
  const dif = $('f-difficulty').value, st = $('f-status').value;
  items = all.filter(p => {
    if (og && p.origin !== og) return false;
    if (cat && p.category !== cat) return false;
    if (dif && p.difficulty !== dif) return false;
    if (st && statusOf(p) !== st) return false;
    if (q) {
      const hay = (p.title + ' ' + p.category + ' ' + (p.tags || []).join(' ') + ' ' + p.prompt).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const dirty = !!(q || og || cat || dif || st);
  $('f-clear').disabled = !dirty;
  $('f-count').textContent = items.length + ' shown';
  renderList();
}

function renderList() {
  const box = $('side-list');
  box.innerHTML = '';
  items.forEach(p => {
    const el = document.createElement('div');
    el.className = 'side-item' + (current && current.id === p.id ? ' active' : '');
    el.innerHTML =
      '<span class="dot ' + statusOf(p) + '"></span>' +
      '<span class="txt"><span class="t">' + esc(p.id + '. ' + p.title) + '</span>' +
      '<span class="m"><span class="og' + (p.origin === 'PRACTICE' ? ' p' : '') + '">' +
      (p.origin === 'ORIGINAL' ? 'ORIGINAL' : 'practice') + '</span> · ' +
      esc(p.difficulty) + ' · ' + esc(p.category) + '</span></span>';
    el.onclick = () => select(p);
    box.appendChild(el);
  });
  if (!items.length) box.innerHTML = '<div style="padding:16px;color:var(--faint);font-size:12px">No problems match.</div>';
}

function refreshProgress() {
  const all = TRACKS[track];
  const solved = all.filter(p => statusOf(p) === 'solved').length;
  $('solved-count').textContent = solved;
  $('total-count').textContent = all.length;
  $('bar-fill').style.width = (all.length ? (solved / all.length * 100) : 0) + '%';
}

/* ---------------------------------------------------------------- select */
function select(p) {
  current = p;
  $('origin-pill').textContent = p.origin === 'ORIGINAL' ? 'ORIGINAL — reported asked' : 'PRACTICE';
  $('origin-pill').className = 'pill ' + (p.origin === 'ORIGINAL' ? 'orig' : 'prac');
  $('topic-pill').textContent = p.category;
  $('diff-pill').textContent = p.difficulty;
  $('diff-pill').className = 'pill ' + p.difficulty.toLowerCase();
  const all = TRACKS[track];
  $('idx-pill').textContent = p.id + ' · ' + (all.indexOf(p) + 1) + '/' + all.length;
  $('title').textContent = p.title;
  $('srcline').textContent = 'Source: ' + p.source;
  $('prompt').innerHTML = p.prompt;
  $('schema-box').style.display = track === 'sql' ? '' : 'none';
  $('editor-label').textContent = track === 'sql' ? 'Your query' : 'Your solution';
  $('btn-run').textContent = track === 'sql' ? '▶ Run Query' : '▶ Run Code';
  const saved = state[key(p)];
  setCode(saved && saved.code ? saved.code : (track === 'sql' ? p.starter : p.signature));
  $('results').innerHTML = '';
  $('answer-mount').innerHTML = '';
  $('status').textContent = '';
  renderList();
  document.querySelector('.main').scrollTop = 0;
}

function move(step) {
  const list = items.length ? items : TRACKS[track];
  const i = list.indexOf(current);
  const j = Math.min(list.length - 1, Math.max(0, (i < 0 ? 0 : i) + step));
  select(list[j]);
}

function mark(p, status) {
  const k = key(p);
  const prev = state[k] || {};
  if (prev.status === 'solved' && status !== 'solved') status = 'solved';
  state[k] = { status: status, code: getCode() };
  refreshProgress();
  renderList();
}

/* ---------------------------------------------------------------- SQL engine */
let SQL = null, db = null;

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

async function ensureDb() {
  if (db) return db;
  $('boot').classList.add('on');
  $('boot-sub').textContent = 'loading SQLite (sql.js) — first run only…';
  if (typeof initSqlJs === 'undefined') {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js');
  }
  SQL = await initSqlJs({
    locateFile: f => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/' + f
  });
  $('boot-sub').textContent = 'seeding the marketplace dataset…';
  db = new SQL.Database();
  BANK.ddl.forEach(stmt => db.run(stmt));
  Object.keys(BANK.data).forEach(name => {
    const t = BANK.data[name];
    const ph = t.cols.map(() => '?').join(',');
    const st = db.prepare('INSERT INTO ' + name + ' VALUES (' + ph + ')');
    t.rows.forEach(r => { st.run(r); });
    st.free();
  });
  $('boot').classList.remove('on');
  return db;
}

function runQuery(sql) {
  const res = db.exec(sql);
  if (!res.length) return { cols: [], rows: [] };
  const last = res[res.length - 1];
  return { cols: last.columns, rows: last.values };
}

function normCell(v) {
  if (v === null || v === undefined) return '\u0000NULL';
  if (typeof v === 'number') return Math.round(v * 1e6) / 1e6;
  return v;
}
function rowKey(r) { return JSON.stringify(r.map(normCell)); }

function compare(userRes, refRes) {
  const uc = userRes.cols.map(c => c.toLowerCase());
  const rc = refRes.cols.map(c => c.toLowerCase());
  let urows = userRes.rows;
  let note = '';
  if (uc.length === rc.length && uc.join('|') !== rc.join('|')) {
    const sameSet = [...uc].sort().join('|') === [...rc].sort().join('|');
    if (sameSet) {
      const idx = rc.map(c => uc.indexOf(c));
      urows = urows.map(r => idx.map(i => r[i]));
      note = 'Column order differed; reordered to match before comparing.';
    } else {
      note = 'Column names differ from the reference (compared positionally).';
    }
  }
  if (uc.length !== rc.length) {
    return { ok: false, note: 'Wrong number of columns: got ' + uc.length + ', expected ' + rc.length + '.', urows: urows };
  }
  const a = urows.map(rowKey).sort();
  const b = refRes.rows.map(rowKey).sort();
  if (a.length !== b.length) {
    return { ok: false, note: note + ' Row count: got ' + a.length + ', expected ' + b.length + '.', urows: urows };
  }
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) {
      return { ok: false, note: note + ' First differing row (sorted): got ' + a[i] + ' expected ' + b[i], urows: urows };
    }
  }
  return { ok: true, note: note, urows: urows };
}

function gridHtml(res, cap) {
  cap = cap || 10;
  if (!res.cols.length) return '<div class="gridnote">no columns returned</div>';
  let h = '<div class="gridwrap"><table class="grid"><tr>';
  res.cols.forEach(c => { h += '<th>' + esc(c) + '</th>'; });
  h += '</tr>';
  res.rows.slice(0, cap).forEach(r => {
    h += '<tr>';
    r.forEach(v => { h += '<td>' + (v === null ? '<span style="color:var(--faint)">NULL</span>' : esc(v)) + '</td>'; });
    h += '</tr>';
  });
  h += '</table></div>';
  if (res.rows.length > cap) h += '<div class="gridnote">' + (res.rows.length - cap) + ' more rows not shown</div>';
  return h;
}

async function runSql() {
  const p = current;
  $('status').textContent = 'running…';
  $('results').innerHTML = '';
  try { await ensureDb(); }
  catch (e) {
    $('boot').classList.remove('on');
    $('status').textContent = '';
    $('results').innerHTML = '<div class="summary no">Could not load the SQL engine: ' + esc(e.message) +
      '<br>The page needs internet access on first run to fetch sql.js.</div>';
    return;
  }
  let userRes, refRes;
  try {
    refRes = runQuery(p.solution);
  } catch (e) {
    $('status').textContent = '';
    $('results').innerHTML = '<div class="summary no">Reference query failed: ' + esc(e.message) + '</div>';
    return;
  }
  try {
    userRes = runQuery(getCode());
  } catch (e) {
    $('status').textContent = '';
    mark(p, 'failed');
    $('results').innerHTML = '<div class="summary no">SQL error</div>' +
      '<div class="case fail"><div class="kv">' + esc(e.message) + '</div></div>';
    return;
  }
  const cmp = compare(userRes, refRes);
  $('status').textContent = '';
  mark(p, cmp.ok ? 'solved' : 'failed');
  let h = '<div class="summary ' + (cmp.ok ? 'ok' : 'no') + '">' +
    (cmp.ok ? '✓ Result matches the reference — ' + refRes.rows.length + ' rows'
            : '✗ Result does not match') + '</div>';
  if (cmp.note) h += '<div class="case"><div class="kv">' + esc(cmp.note) + '</div></div>';
  h += '<div class="case"><div class="hd"><span class="verdict ' + (cmp.ok ? 'pass' : 'fail') +
       '">your result</span><span style="color:var(--faint)">' + userRes.rows.length + ' rows</span></div>' +
       gridHtml(userRes) + '</div>';
  if (!cmp.ok) {
    h += '<div class="case"><div class="hd"><span style="color:var(--amber)">expected shape</span>' +
         '<span style="color:var(--faint)">' + refRes.rows.length + ' rows</span></div>' +
         gridHtml({ cols: refRes.cols, rows: refRes.rows }, 6) + '</div>';
  }
  $('results').innerHTML = h;
}

/* ---------------------------------------------------------------- Python engine */
let pyodide = null;

async function ensurePy() {
  if (pyodide) return pyodide;
  $('boot').classList.add('on');
  $('boot-sub').textContent = 'loading Pyodide — first run only, ~10s…';
  if (typeof loadPyodide === 'undefined') {
    await loadScript('https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js');
  }
  pyodide = await loadPyodide();
  $('boot').classList.remove('on');
  return pyodide;
}

function harness(p, userCode) {
  const tests = JSON.stringify(p.tests);
  return userCode + "\n\n" +
    "import json as __json\n" +
    "__tests = __json.loads(r'''" + tests.replace(/'''/g, "") + "''')\n" +
    "__out = []\n" +
    "for __t in __tests:\n" +
    "    __rec = {'hidden': __t.get('hidden', False), 'args': __t['args'], 'expected': __t['expected']}\n" +
    "    try:\n" +
    "        __got = " + p.fn + "(*__t['args'])\n" +
    "        __rec['ok'] = (__got == __t['expected'])\n" +
    "        __rec['got'] = __got\n" +
    "    except Exception as __e:\n" +
    "        __rec['ok'] = False\n" +
    "        __rec['error'] = type(__e).__name__ + ': ' + str(__e)\n" +
    "    __out.append(__rec)\n" +
    "print(__json.dumps(__out, default=repr))\n";
}

async function runPy() {
  const p = current;
  $('status').textContent = 'running…';
  $('results').innerHTML = '';
  try { await ensurePy(); }
  catch (e) {
    $('boot').classList.remove('on');
    $('status').textContent = '';
    $('results').innerHTML = '<div class="summary no">Could not load Pyodide: ' + esc(e.message) +
      '<br>The page needs internet access on first run.</div>';
    return;
  }
  let captured = '';
  pyodide.setStdout({ batched: s => { captured += s + '\n'; } });
  try {
    pyodide.runPython(harness(p, getCode()));
  } catch (e) {
    $('status').textContent = '';
    mark(p, 'failed');
    $('results').innerHTML = '<div class="summary no">Python error</div>' +
      '<div class="case fail"><div class="kv">' + esc(String(e).split('\n').slice(-6).join('\n')) + '</div></div>';
    return;
  }
  let results;
  try { results = JSON.parse(captured.trim().split('\n').pop()); }
  catch (e) {
    $('status').textContent = '';
    $('results').innerHTML = '<div class="summary no">Could not read test output.</div>';
    return;
  }
  const passed = results.filter(r => r.ok).length;
  const ok = passed === results.length;
  $('status').textContent = '';
  mark(p, ok ? 'solved' : 'failed');
  let h = '<div class="summary ' + (ok ? 'ok' : 'no') + '">' +
    (ok ? '✓ ' : '✗ ') + passed + ' / ' + results.length + ' test cases passed</div>';
  results.forEach((r, i) => {
    h += '<div class="case ' + (r.ok ? 'pass' : 'fail') + '"><div class="hd">' +
      '<span class="verdict ' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? 'PASS' : 'FAIL') + '</span>' +
      '<span style="color:var(--faint)">case ' + (i + 1) + (r.hidden ? ' (hidden)' : '') + '</span></div>';
    if (!r.ok) {
      if (!r.hidden) {
        h += '<div class="kv"><b>input</b> ' + esc(JSON.stringify(r.args)) + '</div>';
        h += '<div class="kv"><b>expected</b> ' + esc(JSON.stringify(r.expected)) + '</div>';
      }
      if (r.error) h += '<div class="kv"><b>error</b> ' + esc(r.error) + '</div>';
      else if (!r.hidden) h += '<div class="kv"><b>got</b> ' + esc(JSON.stringify(r.got)) + '</div>';
      else h += '<div class="kv">hidden case — inputs withheld</div>';
    }
    h += '</div>';
  });
  $('results').innerHTML = h;
}

function run() { return track === 'sql' ? runSql() : runPy(); }

/* ---------------------------------------------------------------- answer */
function showAnswer() {
  const p = current;
  const body = track === 'sql' ? p.solution : p.solution;
  $('answer-mount').innerHTML =
    '<div class="answer"><h4>Reference solution</h4><pre>' + esc(body) + '</pre>' +
    '<div class="acts"><button class="ghost" id="btn-load">Load into editor</button>' +
    '<button class="ghost" id="btn-hide">Hide</button></div></div>';
  $('btn-load').onclick = () => { setCode(body); };
  $('btn-hide').onclick = () => { $('answer-mount').innerHTML = ''; };
}

/* ---------------------------------------------------------------- schema */
function renderSchema() {
  const box = $('schema-body');
  let h = '';
  BANK.ddl.forEach(stmt => {
    const m = stmt.match(/CREATE TABLE (\w+)\s*\(([\s\S]*)\)/);
    if (!m) return;
    const cols = m[2].replace(/\s+/g, ' ').trim();
    const n = (BANK.data[m[1]] || { rows: [] }).rows.length;
    h += '<div><span class="tb">' + esc(m[1]) + '</span> <span style="color:var(--faint)">(' + n +
         ' rows)</span><br><span class="cl">' + esc(cols) + '</span></div>';
  });
  box.innerHTML = h;
}

/* ---------------------------------------------------------------- boot */
function fillCategories() {
  const sel = $('f-category');
  const cats = [...new Set(TRACKS[track].map(p => p.category))].sort();
  sel.innerHTML = '<option value="">All</option>' +
    cats.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('');
}

function switchTrack(t) {
  track = t;
  $('tab-sql').classList.toggle('on', t === 'sql');
  $('tab-python').classList.toggle('on', t === 'python');
  setMode(t);
  fillCategories();
  $('f-category').value = '';
  applyFilters();
  refreshProgress();
  select(TRACKS[track][0]);
}

initEditor();
renderSchema();
$('tab-sql').onclick = () => switchTrack('sql');
$('tab-python').onclick = () => switchTrack('python');
$('btn-run').onclick = run;
$('btn-answer').onclick = showAnswer;
$('btn-reset').onclick = () => {
  setCode(track === 'sql' ? current.starter : current.signature);
  $('results').innerHTML = '';
};
$('btn-prev').onclick = () => move(-1);
$('btn-next').onclick = () => move(1);
['f-search', 'f-origin', 'f-category', 'f-difficulty', 'f-status'].forEach(id => {
  $(id).addEventListener('input', applyFilters);
  $(id).addEventListener('change', applyFilters);
});
$('f-clear').onclick = () => {
  $('f-search').value = ''; $('f-origin').value = ''; $('f-category').value = '';
  $('f-difficulty').value = ''; $('f-status').value = '';
  applyFilters();
};
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
});

switchTrack('sql');
</script>
